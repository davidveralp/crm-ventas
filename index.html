  <div class="stack"><section class="panel"><div class="panel-h"><div><h2>Empresa</h2><p>Aparece en contratos, avisos y liquidaciones.</p></div></div><div class="dialog" style="box-shadow:none;border:none;width:100%"><div class="body" style="padding:0">${[['nombre','Nombre'],['rut','RUT'],['direccion','Dirección'],['ciudad','Ciudad'],['telefono','Teléfono de ventas']].map(([k,l])=>`<div class="fld"><label for="emp_${k}">${l}</label><input id="emp_${k}" data-emp="${k}" value="${esc(DB.empresa[k])}"></div>`).join('')}</div></div></section>
  <section class="panel"><div class="panel-h"><div><h2>Vendedores</h2><p>Los inactivos no reciben leads nuevos.</p></div></div>${DB.vendedores.map(u=>`<div class="check"><input aria-label="Nombre" data-vn="${u.id}" value="${esc(u.nombre)}" style="padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);min-width:0"><label class="actions" style="font-size:12.5px"><input type="checkbox" data-va="${u.id}" ${u.activo?'checked':''}> Activo</label></div>`).join('')}
  <div class="actions" style="margin-top:10px"><input id="newVend" class="search" placeholder="Nombre del nuevo vendedor" aria-label="Nuevo vendedor"><button class="btn sm" data-act="addVend">Agregar</button></div></section>
  <section class="panel"><div class="panel-h"><div><h2>Catálogos</h2><p>Uno por línea.</p></div></div><div class="grid3" style="gap:12px">${[['canales','Canales de leads'],['ubicaciones','Ubicaciones'],['financieras','Financieras']].map(([k,l])=>`<div class="fld"><label for="cat_${k}">${l}</label><textarea id="cat_${k}" data-cat="${k}" rows="6" style="padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:13px">${esc(DB[k].join('\n'))}</textarea></div>`).join('')}</div></section>
  <section class="panel"><div class="panel-h"><div><h2>Respaldo de datos</h2><p>Los datos viven en este navegador. Guarda un respaldo con regularidad o úsalo para pasar la información a otro equipo.</p></div></div>
  <div class="actions"><button class="btn" data-act="exportCopy">Copiar respaldo</button><button class="btn" data-act="exportFile">Descargar respaldo</button><button class="btn" data-act="importFile">Importar archivo</button><button class="btn" data-act="importPaste">Pegar respaldo</button></div>
  <div class="actions" style="margin-top:12px"><button class="btn danger" data-act="reset" data-mode="demo">Restaurar datos de ejemplo</button><button class="btn danger" data-act="reset" data-mode="blank">Empezar sin datos</button></div></section></div></div>`;
}
</script>
<script>
/* ============ Formularios ============ */
let FORM=null;
const o2=a=>a.map(x=>Array.isArray(x)?x:[x,x]);
const perOpts=()=>[['','Elegir…'],['__new','+ Persona nueva'],...DB.personas.map(p=>[p.id,p.nombre+(p.rut?' · '+p.rut:'')])];
const vendOpts=(blank)=>[...(blank?[['','Sin asignar']]:[]),...DB.vendedores.filter(u=>u.activo).map(u=>[u.id,u.nombre])];
function perFields(px,l,req){return [{k:px+'Id',l,t:'sel',opts:perOpts(),req},{k:px+'Nom',l:'Nombre o razón social',t:'text',show:o=>o[px+'Id']==='__new',req:true},{k:px+'Rut',l:'RUT',t:'text',show:o=>o[px+'Id']==='__new'},{k:px+'Tel',l:'Teléfono',t:'text',show:o=>o[px+'Id']==='__new'}]}
function resolvePer(o,px){const id=o[px+'Id'];if(id!=='__new')return id;const p={id:uid('p'),nombre:o[px+'Nom'],rut:o[px+'Rut']||'',telefono:o[px+'Tel']||'',email:''};DB.personas.push(p);return p.id}
const vehFields=()=>[{k:'patente',l:'Patente',t:'text',req:true,hint:'Formato BBBB10 o AB1234'},{k:'vin',l:'VIN / chasis',t:'text'},{k:'marca',l:'Marca',t:'text',req:true},{k:'modelo',l:'Modelo',t:'text',req:true},{k:'version',l:'Versión',t:'text'},{k:'anio',l:'Año',t:'num',req:true},{k:'km',l:'Kilometraje',t:'num'},{k:'color',l:'Color',t:'text'},{k:'combustible',l:'Combustible',t:'sel',opts:o2(['Bencina','Diésel','Híbrido','Eléctrico','GLP'])},{k:'transmision',l:'Transmisión',t:'sel',opts:o2(['Manual','Automática'])},{k:'ubicacion',l:'Ubicación',t:'sel',opts:o2(DB.ubicaciones)}];
const normPat=p=>String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function patErr(p,selfId){p=normPat(p);if(!/^([A-Z]{4}\d{2}|[A-Z]{2}\d{4})$/.test(p))return 'La patente debe tener 4 letras y 2 números, o 2 letras y 4 números.';if(DB.vehiculos.some(v=>v.id!==selfId&&normPat(v.patente)===p&&!['entregado','devuelto'].includes(v.estado)))return 'Ya hay un vehículo activo con esa patente.'}
const nuevoV=o=>({id:uid('v'),patente:normPat(o.patente),vin:o.vin,marca:o.marca,modelo:o.modelo,version:o.version,anio:+o.anio,km:+o.km||0,color:o.color,combustible:o.combustible,transmision:o.transmision,ubicacion:o.ubicacion,estado:'evaluacion',ingreso:o.ingreso||HOY(),precio:+o.precio||0,costoCompra:0,proveedorId:'',checklist:Object.fromEntries(CHECKS.map(c=>[c.k,'pend'])),obsLegal:'',gastos:[],foto:'',publicado:{},notas:o.notas||'',reserva:null,venta:null,creado:new Date().toISOString()});

const FORMS={
  compra:{eb:'Inventario',t:'Registrar compra o toma',btn:'Registrar compra',
    fields:()=>[{t:'sec',l:'Vehículo'},...vehFields(),{t:'sec',l:'Compra'},...perFields('prov','Comprado a',true),{k:'costoCompra',l:'Precio de compra',t:'money',req:true},{k:'ingreso',l:'Fecha de ingreso',t:'date',req:true},{k:'precio',l:'Precio de publicación objetivo',t:'money',hint:'Puedes definirlo después'},{k:'notas',l:'Notas de la tasación',t:'area'}],
    init:()=>({combustible:'Bencina',transmision:'Manual',ubicacion:DB.ubicaciones[0],ingreso:HOY()}),
    save(o){const e=patErr(o.patente);if(e)return e;const v=nuevoV(o);v.origen='compra';v.costoCompra=+o.costoCompra;v.proveedorId=resolvePer(o,'prov');DB.vehiculos.push(v);log(`VEHICULO_INGRESADO: compra por ${clp(v.costoCompra)}`,v.id);return {go:v.id}}},
  consigNueva:{eb:'Consignación',t:'Ingresar auto en consignación',btn:'Crear contrato',
    fields:()=>[{t:'sec',l:'Consignante'},...perFields('cons','Dueño del vehículo',true),{t:'sec',l:'Vehículo'},...vehFields(),{t:'sec',l:'Condiciones'},{k:'inicio',l:'Inicio del contrato',t:'date',req:true},{k:'plazo',l:'Plazo',t:'num',req:true,hint:'Días corridos'},{k:'minimo',l:'Precio mínimo acordado',t:'money',req:true,hint:'Lo que el dueño acepta como piso'},{k:'precio',l:'Precio de publicación',t:'money',req:true},{k:'comTipo',l:'Tipo de comisión',t:'sel',opts:[['pct','Porcentaje del precio'],['fija','Monto fijo']]},{k:'comValor',l:'Comisión',t:'num',req:true,hint:'% o $ según el tipo'}],
    init:()=>({combustible:'Bencina',transmision:'Manual',ubicacion:DB.ubicaciones[0],inicio:HOY(),plazo:DB.cfg.plazoDef,comTipo:'pct',comValor:DB.cfg.comPctDef}),
    save(o){const e=patErr(o.patente);if(e)return e;if(+o.precio<+o.minimo)return 'El precio de publicación no puede ser menor al mínimo acordado.';const v=nuevoV({...o,ingreso:o.inicio});v.origen='consignacion';const pid=resolvePer(o,'cons');v.proveedorId='';DB.vehiculos.push(v);
      DB.consignaciones.push({id:uid('c'),vehiculoId:v.id,consignanteId:pid,inicio:o.inicio,plazo:+o.plazo,minimo:+o.minimo,comTipo:o.comTipo,comValor:+o.comValor,estado:'vigente',liq:null});log(`CONSIGNACION_CREADA: mínimo ${clp(o.minimo)}, ${o.comTipo==='pct'?o.comValor+'%':clp(o.comValor)}`,v.id);return {go:v.id}}},
  veh:{eb:'Ficha',t:'Editar ficha del vehículo',btn:'Guardar',
    fields:id=>{const v=veh(id);return [...vehFields(),{k:'ingreso',l:'Fecha de ingreso',t:'date',req:true},{k:'precio',l:'Precio publicado',t:'money'},...(v.origen!=='consignacion'?[{k:'costoCompra',l:v.origen==='parte_pago'?'Valor de tasación':'Costo de compra',t:'money',req:true}]:[]),{k:'obsLegal',l:'Observación legal',t:'area',hint:'Se muestra destacada en la ficha'},{k:'notas',l:'Notas',t:'area'}]},
    init:id=>({...veh(id),patente:fmtPat(veh(id).patente)}),
    save(o,F){const v=veh(F.id),e=patErr(o.patente,v.id);if(e)return e;const cambios=[];if(+o.precio!==+v.precio)cambios.push(`precio ${clp(v.precio)} → ${clp(o.precio)}`);
      Object.assign(v,{...o,patente:normPat(o.patente),anio:+o.anio,km:+o.km||0,precio:+o.precio||0,costoCompra:v.origen!=='consignacion'?+o.costoCompra:0});log('Ficha actualizada'+(cambios.length?': '+cambios.join(', '):''),v.id)}},
  contrato:{eb:'Consignación',t:'Condiciones del contrato',btn:'Guardar',
    fields:()=>[{k:'inicio',l:'Inicio',t:'date',req:true},{k:'plazo',l:'Plazo (días)',t:'num',req:true},{k:'minimo',l:'Precio mínimo',t:'money',req:true},{k:'comTipo',l:'Tipo de comisión',t:'sel',opts:[['pct','Porcentaje del precio'],['fija','Monto fijo']]},{k:'comValor',l:'Comisión',t:'num',req:true}],
    init:id=>({...DB.consignaciones.find(c=>c.id===id)}),
    save(o,F){const c=DB.consignaciones.find(x=>x.id===F.id);Object.assign(c,{inicio:o.inicio,plazo:+o.plazo,minimo:+o.minimo,comTipo:o.comTipo,comValor:+o.comValor});log(`Contrato de consignación actualizado: ${c.plazo} días, mínimo ${clp(c.minimo)}`,c.vehiculoId)}},
  gasto:{eb:'Reacondicionamiento',t:'Gasto del vehículo',btn:'Guardar gasto',
    fields:(id)=>[{k:'fecha',l:'Fecha',t:'date',req:true},{k:'tipo',l:'Tipo',t:'sel',opts:o2(GASTOS)},{k:'desc',l:'Detalle',t:'text',req:true,full:true},{k:'monto',l:'Monto con IVA',t:'money',req:true},...(veh(id).origen==='consignacion'?[{k:'cargoConsignante',l:'Se descuenta al consignante en la liquidación',t:'chk'}]:[])],
    init:(id,ctx)=>ctx?.sub?{...veh(id).gastos.find(g=>g.id===ctx.sub)}:{fecha:HOY(),tipo:GASTOS[0]},
    save(o,F){const v=veh(F.id);if(F.ctx?.sub){Object.assign(v.gastos.find(g=>g.id===F.ctx.sub),{...o,monto:+o.monto});log(`Gasto editado: ${o.tipo} ${clp(o.monto)}`,v.id)}else{v.gastos.push({id:uid('g'),...o,monto:+o.monto,cargoConsignante:!!o.cargoConsignante});log(`Gasto agregado: ${o.tipo}, ${o.desc}, ${clp(o.monto)}`,v.id)}},
    del(F){const v=veh(F.id),g=v.gastos.find(x=>x.id===F.ctx?.sub);if(!g)return;v.gastos=v.gastos.filter(x=>x!==g);log(`Gasto eliminado: ${g.tipo} ${clp(g.monto)}`,v.id)}},
  reservado:{eb:'Flujo del vehículo',t:'Registrar reserva',btn:'Reservar',
    fields:()=>[...perFields('cli','Cliente',true),{k:'vendedorId',l:'Vendedor',t:'sel',opts:vendOpts(),req:true},{k:'fecha',l:'Fecha',t:'date',req:true},{k:'monto',l:'Abono de reserva',t:'money',req:true}],
    init:(id,ctx)=>{const l=ctx?.leadId&&DB.leads.find(x=>x.id===ctx.leadId);return {vendedorId:UI.role==='vendedor'?UI.vend:(l?.vendedorId||''),fecha:HOY(),...cliDeLead(l)}},
    save(o,F){const v=veh(F.id);const cli=resolvePer(o,'cli');ligarLead(F,cli);const err=transicion(v,'reservado',{fecha:o.fecha,clienteId:cli,vendedorId:o.vendedorId,monto:+o.monto});if(err)return err.join(' ');log(`Reserva de ${clp(o.monto)} por ${per(v.reserva.clienteId).nombre}`,v.id)}},
  vendido:{eb:'Flujo del vehículo',t:'Registrar venta',btn:'Registrar venta',
    fields:id=>{const v=veh(id),c=consDe(v);return [{t:'sec',l:'Venta'},...perFields('cli','Cliente',true),{k:'vendedorId',l:'Vendedor',t:'sel',opts:vendOpts(),req:true},{k:'fecha',l:'Fecha de venta',t:'date',req:true},{k:'precio',l:'Precio de venta',t:'money',req:true,hint:c?`Mínimo pactado con el dueño: ${clp(c.minimo)}`:`Publicado: ${clp(v.precio)}`},
      ...(c?[{k:'autMin',l:'El consignante autorizó por escrito vender bajo el mínimo',t:'chk',full:true}]:[]),
      {t:'sec',l:'Pago y financiamiento'},{k:'pago',l:'Forma de pago',t:'sel',opts:Object.entries(PAGO)},{k:'financiera',l:'Financiera',t:'sel',opts:o2(DB.financieras),show:o=>o.pago!=='contado'},{k:'montoFinanciado',l:'Monto financiado',t:'money',show:o=>o.pago!=='contado'},{k:'credito',l:'Estado del crédito',t:'sel',opts:Object.entries(CREDITO).map(([k,[l]])=>[k,l]),show:o=>o.pago!=='contado'},
      {t:'sec',l:'Parte de pago'},{k:'pp',l:'El cliente entrega un auto en parte de pago',t:'chk',full:true},{k:'ppPat',l:'Patente',t:'text',show:o=>o.pp,req:true},{k:'ppMarca',l:'Marca',t:'text',show:o=>o.pp,req:true},{k:'ppModelo',l:'Modelo',t:'text',show:o=>o.pp,req:true},{k:'ppAnio',l:'Año',t:'num',show:o=>o.pp,req:true},{k:'ppKm',l:'Kilometraje',t:'num',show:o=>o.pp},{k:'ppValor',l:'Valor de tasación',t:'money',show:o=>o.pp,req:true,hint:'Entra al inventario en evaluación'}]},
    init:(id,ctx)=>{const v=veh(id),l=ctx?.leadId&&DB.leads.find(x=>x.id===ctx.leadId);return {...cliDeLead(l),...(v.reserva?{cliId:v.reserva.clienteId}:{}),vendedorId:v.reserva?.vendedorId||(UI.role==='vendedor'?UI.vend:l?.vendedorId||''),fecha:HOY(),precio:v.precio,pago:'contado',credito:'evaluacion',financiera:DB.financieras[0]}},
    save(o,F){const v=veh(F.id),c=consDe(v),ve=validar(v,'vendido').err;if(ve.length)return ve.join(' ');if(c&&+o.precio<c.minimo&&!o.autMin)return `El precio está bajo el mínimo de ${clp(c.minimo)}. Marca la autorización escrita del consignante o ajusta el precio.`;
      if(o.pp){const e=patErr(o.ppPat);if(e)return 'Parte de pago: '+e}
      if(o.pago!=='contado'&&!(+o.montoFinanciado>0))return 'Indica el monto financiado.';
      const cli=resolvePer(o,'cli');ligarLead(F,cli);let ppId='';
      if(o.pp){const n=nuevoV({patente:o.ppPat,marca:o.ppMarca,modelo:o.ppModelo,anio:o.ppAnio,km:o.ppKm,combustible:'Bencina',transmision:'Manual',ubicacion:DB.ubicaciones[0],notas:`Recibido en parte de pago de ${fmtPat(v.patente)} ${nomV(v)}.`});n.origen='parte_pago';n.costoCompra=+o.ppValor;n.proveedorId=cli;DB.vehiculos.push(n);ppId=n.id;log(`VEHICULO_INGRESADO: parte de pago tasada en ${clp(o.ppValor)}`,n.id)}
      const cont=o.pago==='contado';
      const err=transicion(v,'vendido',{fecha:o.fecha,clienteId:cli,vendedorId:o.vendedorId,precio:+o.precio,pago:o.pago,financiera:cont?'':o.financiera,montoFinanciado:cont?0:+o.montoFinanciado,credito:cont?'':o.credito,creditoFecha:o.fecha,transferencia:'pendiente',parteDePagoId:ppId,leadId:F.ctx?.leadId||'',abono:v.reserva?.monto||0});
      if(err)return err.join(' ');log(`Venta por ${clp(o.precio)} a ${per(cli).nombre}${c&&+o.precio<c.minimo?' (bajo el mínimo, con autorización)':''}`,v.id);return {go:v.id}}},
  entregado:{eb:'Flujo del vehículo',t:'Registrar entrega',btn:'Registrar entrega',
    fields:()=>[{k:'entrega',l:'Fecha de entrega',t:'date',req:true},{k:'transferencia',l:'Estado de la transferencia',t:'sel',opts:Object.entries(TRANSF).map(([k,[l]])=>[k,l])},{k:'docs',l:'Contrato de compraventa firmado y documentos entregados al cliente',t:'chk',full:true}],
    init:id=>({entrega:HOY(),transferencia:veh(id).venta.transferencia==='pendiente'?'firmada':veh(id).venta.transferencia}),
    save(o,F){const v=veh(F.id);if(!o.docs)return 'Confirma que el contrato está firmado y los documentos entregados.';if(v.venta.financiera&&!['aprobado','cursado'].includes(v.venta.credito))return 'El crédito aún no está aprobado. No se puede entregar el auto.';v.venta.transferencia=o.transferencia;const err=transicion(v,'entregado',{entrega:o.entrega});if(err)return err.join(' ')}},
  devuelto:{eb:'Flujo del vehículo',t:'Cerrar sin venta',btn:'Confirmar cierre',
    fields:()=>[{k:'motivo',l:'Motivo',t:'area',req:true,hint:'Por ejemplo: prenda sin alzar, dueño retira el auto, falla mecánica mayor'}],init:()=>({}),
    save(o,F){const err=transicion(veh(F.id),'devuelto',{},o.motivo);if(err)return err.join(' ')}},
  disponible:{eb:'Flujo del vehículo',t:'Liberar reserva',btn:'Liberar',
    fields:()=>[{k:'motivo',l:'Motivo',t:'area',req:true,hint:'El abono se gestiona según la política de reservas'}],init:()=>({}),
    save(o,F){const err=transicion(veh(F.id),'disponible',{},o.motivo);if(err)return err.join(' ')}},
  liq:{eb:'Consignación',t:'Registrar pago al consignante',btn:'Registrar pago',
    fields:id=>[{t:'html',html:`<div class="callout t-low">Monto calculado: <b>${clp(liquidacion(veh(id)).aPagar)}</b> a ${esc(per(consDe(veh(id)).consignanteId)?.nombre)}.</div>`},{k:'fecha',l:'Fecha de pago',t:'date',req:true},{k:'monto',l:'Monto pagado',t:'money',req:true},{k:'medio',l:'Medio de pago',t:'sel',opts:o2(['Transferencia bancaria','Vale vista','Cheque','Efectivo'])}],
    init:id=>({fecha:HOY(),monto:Math.round(liquidacion(veh(id)).aPagar)}),
    save(o,F){const v=veh(F.id),c=consDe(v);c.liq={fecha:o.fecha,monto:+o.monto,medio:o.medio};c.estado='liquidada';log(`CONSIGNACION_LIQUIDADA: ${clp(o.monto)} por ${o.medio}`,v.id)}},
  lead:{eb:'Lead',t:'Lead',btn:'Guardar',
    fields:id=>{const l=id&&DB.leads.find(x=>x.id===id);return [{k:'nombre',l:'Nombre',t:'text',req:true},{k:'telefono',l:'Teléfono',t:'text'},{k:'email',l:'Correo',t:'text'},{k:'canal',l:'Canal',t:'sel',opts:o2(DB.canales)},
      {k:'vehiculoId',l:'Auto de interés',t:'sel',full:true,opts:[['','Sin auto específico'],...DB.vehiculos.filter(v=>['disponible','reservado'].includes(v.estado)||v.id===l?.vehiculoId).map(v=>[v.id,`${fmtPat(v.patente)} · ${nomV(v)} · ${mm(v.precio)}`])]},
      {k:'vendedorId',l:'Vendedor',t:'sel',opts:UI.role==='vendedor'?[['','Sin asignar'],[UI.vend,vend(UI.vend)?.nombre]]:vendOpts(true)},{k:'etapa',l:'Etapa',t:'sel',opts:Object.entries(ETAPAS).map(([k,[x]])=>[k,x])},
      {k:'motivo',l:'Motivo de pérdida',t:'sel',opts:o2(['','Precio sobre mercado','Compró en otra automotora','No calificó al crédito','Desistió de comprar','No responde','Otro']),show:o=>o.etapa==='perdido',req:true},
      {k:'prox',l:'Próximo seguimiento',t:'date',show:o=>!['ganado','perdido'].includes(o.etapa)},{k:'notas',l:'Notas',t:'area'},...(l?[{t:'html',html:leadHist(l)}]:[])]},
    init:(id,ctx)=>id?{...DB.leads.find(x=>x.id===id)}:{canal:DB.canales[0],etapa:'nuevo',vehiculoId:ctx?.vid||'',vendedorId:UI.role==='vendedor'?UI.vend:'',prox:addD(1)},
    save(o,F){if(o.etapa==='perdido'&&!o.motivo)return 'Indica el motivo de pérdida.';
      if(F.id){const l=DB.leads.find(x=>x.id===F.id);if(l.etapa!==o.etapa)log(`LEAD_${o.etapa.toUpperCase()}: ${l.nombre} pasa a ${ETAPAS[o.etapa][0]}`,l.vehiculoId);if(l.vendedorId!==o.vendedorId&&o.vendedorId)log(`Lead ${l.nombre} asignado a ${vend(o.vendedorId)?.nombre}`,l.vehiculoId);Object.assign(l,o);if(['ganado','perdido'].includes(o.etapa))l.prox=''}
      else{const l={id:uid('l'),...o,creado:new Date().toISOString(),contactos:[]};DB.leads.push(l);log(`LEAD_CREADO: ${l.nombre} desde ${l.canal}`,l.vehiculoId)}}}
};
const cliDeLead=l=>!l?{}:l.personaId?{cliId:l.personaId}:{cliId:'__new',cliNom:l.nombre,cliTel:l.telefono};
function ligarLead(F,cli){const l=F.ctx?.leadId&&DB.leads.find(x=>x.id===F.ctx.leadId);if(l&&!l.personaId)l.personaId=cli}
function leadHist(l){const v=veh(l.vehiculoId);const canSell=v&&['disponible','reservado'].includes(v.estado)&&!['ganado','perdido'].includes(l.etapa);
  return `<div class="fsec" style="margin-bottom:6px">Contactos</div>${l.contactos.length?`<div class="log">${[...l.contactos].reverse().map(c=>`<div class="it"><span class="mono">${fdt(c.ts)}</span><span><b style="font-weight:600">${esc(c.tipo)}</b> · ${esc(c.nota)}</span></div>`).join('')}</div>`:'<div class="empty">Sin contactos registrados.</div>'}
  <div class="actions" style="margin-top:10px"><select class="sel" id="cTipo" aria-label="Tipo de contacto">${['WhatsApp','Llamada','Correo','Visita'].map(t=>`<option>${t}</option>`).join('')}</select><input class="search" id="cNota" placeholder="Qué se conversó" aria-label="Nota del contacto" style="flex:1"><button class="btn sm" data-act="addContact" data-id="${l.id}">Registrar contacto</button></div>
  ${canSell?`<div class="actions" style="margin-top:12px">${v.estado==='disponible'?`<button class="btn sm" data-act="leadTo" data-to="reservado" data-id="${l.id}">Reservar ${esc(fmtPat(v.patente))}</button>`:''}<button class="btn sm pri" data-act="leadTo" data-to="vendido" data-id="${l.id}">Convertir en venta</button></div>`:''}`}
function fieldHtml(f,val){
  if(f.t==='sec')return `<div class="fsec">${f.l}</div>`;
  if(f.t==='html')return `<div class="fld full">${f.html}</div>`;
  const id='f_'+f.k,w=(inner,cls='')=>`<div class="fld ${cls} ${f.full||f.t==='area'?'full':''}" data-k="${f.k}">${inner}</div>`;
  if(f.t==='chk')return w(`<input type="checkbox" id="${id}" ${val?'checked':''}><label for="${id}">${f.l}</label>`,'chk');
  const lab=`<label for="${id}">${f.l}${f.req?' *':''}</label>`,hint=f.hint?`<span class="hint">${esc(f.hint)}</span>`:'';
  if(f.t==='sel')return w(lab+`<select id="${id}">${f.opts.map(([k,l])=>`<option value="${esc(k)}" ${String(val??'')===String(k)?'selected':''}>${esc(l||'—')}</option>`).join('')}</select>`+hint);
  if(f.t==='area')return w(lab+`<textarea id="${id}">${esc(val)}</textarea>`+hint);
  const type=f.t==='date'?'date':(f.t==='num'||f.t==='money')?'number':'text';
  return w(lab+`<input id="${id}" type="${type}" ${type==='number'?'min="0" step="any" inputmode="numeric"':''} value="${esc(val??'')}">`+hint);
}
function openForm(tipo,id,ctx){
  const F=FORMS[tipo];const fields=F.fields(id);const o=F.init(id,ctx)||{};
  FORM={tipo,id,ctx,fields};
  $('#mEyebrow').textContent=F.eb;$('#mTitle').textContent=tipo==='lead'&&id?o.nombre:(id&&veh(id)&&tipo!=='veh'?`${F.t} · ${fmtPat(veh(id).patente)}`:F.t);
  $('#mBody').innerHTML=fields.map(f=>fieldHtml(f,o[f.k])).join('')+`<div class="ferr" id="fErr" hidden></div>`;
  const del=F.del&&ctx?.sub;
  $('#mFoot').innerHTML=`<div>${del?`<button class="btn danger" data-act="del">Eliminar</button>`:''}</div><div class="actions"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="saveForm">${F.btn}</button></div>`;
  $('#modal').hidden=false;deps();const first=$('#mBody input:not([type=checkbox]),#mBody select');if(first&&!id)first.focus();
}
function readForm(){const o={};for(const f of FORM.fields){if(!f.k||f.t==='sec'||f.t==='html')continue;const el=document.getElementById('f_'+f.k);if(!el)continue;o[f.k]=f.t==='chk'?el.checked:(f.t==='num'||f.t==='money')?(el.value===''?'':+el.value):el.value.trim()}return o}
function deps(){if(!FORM)return;const o=readForm();FORM.fields.forEach(f=>{if(f.show&&f.k){const w=document.querySelector(`#mBody [data-k="${f.k}"]`);if(w)w.hidden=!f.show(o)}})}
function saveForm(){
  const o=readForm(),F=FORMS[FORM.tipo];
  const miss=FORM.fields.filter(f=>f.req&&f.k&&(!f.show||f.show(o))&&(o[f.k]===''||o[f.k]==null)).map(f=>f.l);
  const e=$('#fErr');if(miss.length){e.textContent='Completa: '+miss.join(', ')+'.';e.hidden=false;return}
  const r=F.save(o,FORM);if(typeof r==='string'){e.textContent=r;e.hidden=false;return}
  save();closeModal();if(r?.go){UI.view='ficha';UI.id=r.go}render();toast('Guardado');
}
function closeModal(){$('#modal').hidden=true;FORM=null}

/* ============ Textos para copiar ============ */
function avisoTxt(v){const e=DB.empresa;return `${v.marca} ${v.modelo} ${v.version} ${v.anio}
${clp(v.precio)}

· ${(+v.km||0).toLocaleString('es-CL')} km
· Transmisión ${v.transmision.toLowerCase()} · ${v.combustible}
· Color ${v.color||'—'}
${v.checklist?.prenda==='ok'&&v.checklist?.multas==='ok'?'· Papeles al día, sin multas ni prendas':'· Consulta por la documentación'}${CHECKS.some(c=>c.k==='informe'&&v.checklist?.[c.k]==='ok')?' · Informe de historial disponible':''}
· ${v.origen==='consignacion'?'Auto en consignación':'Unidad propia, revisada por nuestro equipo'}
· Recibimos tu auto en parte de pago · Financiamiento con ${DB.financieras.slice(0,2).join(' y ')}

${e.nombre} · ${e.direccion}, ${e.ciudad}
Ventas: ${e.telefono}
Patente ${fmtPat(v.patente)}`}
function contratoTxt(c){const v=veh(c.vehiculoId),p=per(c.consignanteId),e=DB.empresa;return `CONTRATO DE CONSIGNACIÓN DE VEHÍCULO (borrador)

En ${e.ciudad}, a ${fdate(c.inicio)}, entre ${e.nombre}, RUT ${e.rut}, domiciliada en ${e.direccion}, en adelante "la Automotora", y ${p?.nombre}, RUT ${p?.rut||'__________'}, en adelante "el Consignante", se acuerda:

PRIMERO. El Consignante entrega en consignación el vehículo marca ${v.marca}, modelo ${v.modelo} ${v.version}, año ${v.anio}, patente ${fmtPat(v.patente)}, VIN ${v.vin||'__________'}, con ${(+v.km||0).toLocaleString('es-CL')} km, declarando ser su dueño y que se encuentra libre de prendas, prohibiciones y embargos.

SEGUNDO. La Automotora publicará y exhibirá el vehículo a un precio de ${clp(v.precio)}. El precio mínimo de venta es ${clp(c.minimo)}. Toda venta bajo ese valor requiere autorización escrita del Consignante.

TERCERO. La Automotora cobrará una comisión de ${c.comTipo==='pct'?`${c.comValor}% del precio de venta, con un mínimo de ${clp(DB.cfg.comisionMinima)}`:clp(c.comValor)}, IVA incluido, que se descontará al momento de la liquidación.

CUARTO. Los gastos de preparación que el Consignante autorice por escrito se descontarán de la liquidación, con respaldo de boleta o factura.

QUINTO. El plazo de consignación es de ${c.plazo} días corridos, hasta el ${fdate(vence(c))}. Vencido el plazo, las partes podrán renovarlo o el Consignante retirará el vehículo.

SEXTO. Vendido el vehículo, la Automotora pagará al Consignante el precio de venta menos la comisión y los gastos autorizados, dentro de ${DB.cfg.diasLiquidacion} días hábiles desde que reciba el pago total.

SÉPTIMO. La Automotora custodiará el vehículo con la debida diligencia mientras permanezca en sus dependencias.

_____________________          _____________________
${e.nombre}                     ${p?.nombre}

Texto referencial. Revísalo con tu abogado antes de firmarlo.`}
function liqTxt(v){const l=liquidacion(v),p=per(l.c.consignanteId);return `LIQUIDACIÓN DE CONSIGNACIÓN
${DB.empresa.nombre} · ${fdate(HOY())}

Consignante: ${p?.nombre} (${p?.rut||''})
Vehículo: ${nomV(v)} ${v.version}, patente ${fmtPat(v.patente)}
Fecha de venta: ${fdate(v.venta?.fecha)}

Precio de venta ............ ${clp(l.precio)}
Comisión ................... ${clp(-l.com)}
${v.gastos.filter(g=>g.cargoConsignante).map(g=>`${g.tipo}: ${g.desc} ... ${clp(-g.monto)}`).join('\n')||'Sin gastos a cargo del consignante'}
-----------------------------------------
Total a pagar .............. ${clp(l.aPagar)}
${l.c.liq?`\nPagado el ${fdate(l.c.liq.fecha)} por ${l.c.liq.medio}: ${clp(l.c.liq.monto)}`:''}`}

/* ============ Eventos ============ */
function go(view,id){if(view==='lead'){UI.view='leads';UI.q='';render();openForm('lead',id);return}UI.view=view;UI.id=id||null;if(view!=='ficha')UI.q='';render();window.scrollTo(0,0)}
let FOTO_V=null,RESET_T=null;
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='close')return closeModal();
  if(a==='nav')return go(b.dataset.view);
  if(a==='go')return go(b.dataset.view,id);
  if(a==='aarea'){UI.alertArea=b.dataset.a;return render()}
  if(a==='inv'){UI.inv=b.dataset.f;return render()}
  if(a==='rtab'){UI.rentTab=b.dataset.t;return render()}
  if(a==='new')return openForm(b.dataset.tipo,b.dataset.tipo==='lead'?null:id,b.dataset.tipo==='lead'?{vid:id}:null);
  if(a==='edit')return openForm(b.dataset.tipo,id,{sub:b.dataset.sub});
  if(a==='saveForm')return saveForm();
  if(a==='del'){FORMS[FORM.tipo].del(FORM);save();closeModal();render();return toast('Eliminado')}
  if(a==='trans'){const v=veh(id),to=b.dataset.to;
    if(to==='disponible'&&v.estado==='reservado')return openForm('disponible',id);
    if(['reservado','vendido','entregado','devuelto'].includes(to))return openForm(to,id);
    const {err,av}=validar(v,to);if(err.length)return showMsg('Aún no se puede publicar',err,'Resuelve lo siguiente en la ficha:');
    transicion(v,to);save();render();return toast(to==='disponible'?(av.length?`Publicado con ${av.length} verificaciones no obligatorias pendientes`:'Publicado como disponible'):'Estado actualizado')}
  if(a==='chk'){const v=veh(id);v.checklist[b.dataset.k]=b.dataset.val;log(`Verificación ${CHECKS.find(c=>c.k===b.dataset.k).s}: ${CHK_EST[b.dataset.val][0]}`,v.id);save();return render()}
  if(a==='pub'){const v=veh(id),p=b.dataset.p;v.publicado=v.publicado||{};v.publicado[p]=!v.publicado[p];log(`${v.publicado[p]?'Publicado en':'Retirado de'} ${p}`,v.id);save();return render()}
  if(a==='cred'){const v=veh(id);v.venta.credito=b.dataset.val;v.venta.creditoFecha=HOY();log(`Crédito ${v.venta.financiera}: ${CREDITO[b.dataset.val][0]}`,v.id);save();return render()}
  if(a==='transf'){const v=veh(id);v.venta.transferencia=b.dataset.val;log(`Transferencia: ${TRANSF[b.dataset.val][0]}`,v.id);save();return render()}
  if(a==='foto'){FOTO_V=id;return $('#filePhoto').click()}
  if(a==='aviso'){const v=veh(id);if(!v.precio)return toast('Define un precio antes de generar el aviso');return showText('Publicación','Aviso para portales',avisoTxt(v))}
  if(a==='contrato')return showText('Consignación','Contrato de consignación',contratoTxt(DB.consignaciones.find(c=>c.id===id)));
  if(a==='liqTxt')return showText('Consignación','Liquidación',liqTxt(veh(id)));
  if(a==='copyTxt')return copiar(TXT);
  if(a==='addContact'){const l=DB.leads.find(x=>x.id===id),n=$('#cNota').value.trim();if(!n)return toast('Escribe qué se conversó');l.contactos.push({ts:new Date().toISOString(),tipo:$('#cTipo').value,nota:n});if(l.etapa==='nuevo'){l.etapa='contactado';log(`LEAD_CONTACTADO: ${l.nombre}`,l.vehiculoId)}if(!l.prox||dias(l.prox)>=0)l.prox=addD(2);save();render();openForm('lead',id);return toast('Contacto registrado')}
  if(a==='leadTo'){const l=DB.leads.find(x=>x.id===id);closeModal();return openForm(b.dataset.to,l.vehiculoId,{leadId:l.id})}
  if(a==='addVend'){const n=$('#newVend').value.trim();if(!n)return toast('Escribe el nombre');DB.vendedores.push({id:uid('u'),nombre:n,activo:true});log('Vendedor agregado: '+n);save();render();return toast('Vendedor agregado')}
  if(a==='exportCopy')return copiar(JSON.stringify(DB),'Respaldo copiado. Pégalo en un archivo de texto.');
  if(a==='exportFile'){try{const u=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));const x=document.createElement('a');x.href=u;x.download=`patio-respaldo-${HOY()}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Si no se descargó, usa Copiar respaldo')}catch(e){toast('Usa Copiar respaldo')}return}
  if(a==='importFile')return $('#fileImport').click();
  if(a==='importPaste'){FORM=null;$('#mEyebrow').textContent='Respaldo';$('#mTitle').textContent='Pegar respaldo';$('#mBody').innerHTML=`<div class="fld full"><label for="pasteTxt">Contenido del respaldo (JSON)</label><textarea id="pasteTxt" style="min-height:200px;font-family:var(--f-mono);font-size:12px"></textarea><span class="hint">Reemplaza todos los datos actuales de este navegador.</span></div>`;$('#mFoot').innerHTML=`<span></span><div class="actions"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="doPaste">Importar</button></div>`;$('#modal').hidden=false;return}
  if(a==='doPaste'){if(importar($('#pasteTxt').value))closeModal();return}
  if(a==='reset'){if(RESET_T!==b.dataset.mode){RESET_T=b.dataset.mode;b.textContent='Confirmar: se reemplazan todos los datos';setTimeout(()=>{if(RESET_T===b.dataset.mode){RESET_T=null;render()}},4000);return}
    RESET_T=null;DB=seed();if(b.dataset.mode==='blank'){Object.assign(DB,{demo:false,personas:[],vehiculos:[],consignaciones:[],leads:[],bitacora:[]});DB.empresa={nombre:'Mi automotora',rut:'',ciudad:'',telefono:'',direccion:''};log('Datos iniciados en blanco')}save();UI.view='control';render();return toast('Datos reemplazados')}
});
function importar(txt){try{const d=JSON.parse(txt);if(!d.vehiculos||!d.cfg)throw 0;DB=d;save();render();toast('Respaldo importado');return true}catch(e){toast('El archivo no es un respaldo válido de Patio');return false}}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='invQ'||t.id==='leadQ'||t.id==='logQ'){UI.q=t.value;const pos=t.selectionStart;render();const n=$('#'+t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.closest('#mBody'))return deps();
  if(t.id==='role'){UI.role=t.value;UI.alertArea='';UI.leadVend='';return render()}
  if(t.id==='vend'){UI.vend=t.value;return render()}
  if(t.id==='invO'){UI.invOrigen=t.value;return render()}
  if(t.id==='leadC'){UI.leadCanal=t.value;return render()}
  if(t.id==='leadV'){UI.leadVend=t.value;return render()}
  if(t.id==='rSort'){UI.rentSort=t.value;return render()}
  if(t.dataset.cfg){const k=t.dataset.cfg;DB.cfg[k]=t.type==='checkbox'?t.checked:+t.value;log(`Parámetro ${k} = ${DB.cfg[k]}`);save();return toast('Parámetro guardado')}
  if(t.dataset.emp){DB.empresa[t.dataset.emp]=t.value.trim();save();$('#empresaNombre').textContent=DB.empresa.nombre;return toast('Datos de la empresa guardados')}
  if(t.dataset.cat){DB[t.dataset.cat]=t.value.split('\n').map(s=>s.trim()).filter(Boolean);log('Catálogo actualizado: '+t.dataset.cat);save();return toast('Catálogo guardado')}
  if(t.dataset.vn){vend(t.dataset.vn).nombre=t.value.trim();save();return toast('Vendedor actualizado')}
  if(t.dataset.va){vend(t.dataset.va).activo=t.checked;save();return render()}
  if(t.id==='fileImport'&&t.files[0]){const r=new FileReader();r.onload=()=>importar(r.result);r.readAsText(t.files[0]);t.value='';return}
  if(t.id==='filePhoto'&&t.files[0]&&FOTO_V){const f=t.files[0],r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const W=640,s=Math.min(1,W/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const v=veh(FOTO_V),prev=v.foto;v.foto=c.toDataURL('image/jpeg',.72);if(!save()){v.foto=prev;return}log('Foto actualizada',v.id);render();toast('Foto guardada')};img.src=r.result};r.readAsDataURL(f);t.value=''}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal')closeModal()});

load();render();
</script>
