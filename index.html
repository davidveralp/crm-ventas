<title>Patio VPAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: patio de ventas — riel lateral grafito con navegación por espacio de trabajo + área de trabajo con paneles; el acento es el naranjo del precio pegado en el parabrisas; las patentes se dibujan como placas chilenas */
:root{
  --bg:#EEEDEA; --surface:#FFFFFF; --surface-2:#F6F5F2; --ink:#1D2126; --muted:#5C636B; --line:#D9D7D2;
  --accent:#C4540A; --accent-ink:#FFFFFF; --accent-soft:#FBE7D6;
  --side-bg:#23282E; --side-ink:#E4E6E8; --side-muted:#98A0A8; --side-active:#323941;
  --plate:#FFFFFF; --plate-ink:#111417; --plate-line:#9AA0A6;
  --crit:#B42A22; --high:#B8620A; --med:#8B7300; --low:#2C6A94; --ok:#2A7A48; --neutral:#5F6770;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 4px 14px rgba(30,25,20,.05);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1C2024; --surface-2:#22272C; --ink:#E7E6E3; --muted:#9BA2A9; --line:#30363C;
  --accent:#F08A3E; --accent-ink:#1E1106; --accent-soft:#3B2515;
  --side-bg:#0F1214; --side-ink:#DDE0E3; --side-muted:#8A939B; --side-active:#232A30;
  --plate:#EDEDEA; --plate-ink:#111417; --plate-line:#6D747B;
  --crit:#F06A5E; --high:#F0A043; --med:#D8BF4A; --low:#72AEDB; --ok:#5EC287; --neutral:#9DA6AE;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --surface-2:#22272C; --ink:#E7E6E3; --muted:#9BA2A9; --line:#30363C;
  --accent:#F08A3E; --accent-ink:#1E1106; --accent-soft:#3B2515;
  --side-bg:#0F1214; --side-ink:#DDE0E3; --side-muted:#8A939B; --side-active:#232A30;
  --plate:#EDEDEA; --plate-ink:#111417; --plate-line:#6D747B;
  --crit:#F06A5E; --high:#F0A043; --med:#D8BF4A; --low:#72AEDB; --ok:#5EC287; --neutral:#9DA6AE;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;font-weight:700;letter-spacing:.005em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.84em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sub{display:block;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{width:36px;height:36px;flex:none}
.brand b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:block}
.brand small{display:block;color:var(--side-muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:5px;color:var(--side-ink);font-size:13.5px}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .cnt{font-family:var(--f-mono);font-size:10.5px;min-width:22px;text-align:center;padding:1px 6px;border-radius:9px;background:var(--crit);color:#fff}
.nav .cnt.soft{background:transparent;color:var(--side-muted);border:1px solid var(--side-active)}
.nav-sep{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:10px 10px 4px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 8px;line-height:1.45}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:20px 28px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:30px;line-height:1.05}
.top .fn{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:72ch}
.rolebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rolebox label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo-tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px dashed var(--accent);padding:2px 8px;border-radius:4px}
main{padding:22px 28px 60px;display:flex;flex-direction:column;gap:20px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.panel-h h2{font-size:20px}
.panel-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:72ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
.grid2 > *,.grid3 > *{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Franja de indicadores */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.strip > div{padding:15px 18px;min-width:0}
.strip > div + div{border-left:1px solid var(--line)}
.big{font-family:var(--f-display);font-stretch:92%;font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.strip .note{font-size:12px;color:var(--muted);margin-top:4px}

/* Tonos */
.t-crit{--tone:var(--crit)} .t-high{--tone:var(--high)} .t-med{--tone:var(--med)} .t-low{--tone:var(--low)} .t-ok{--tone:var(--ok)} .t-neutral{--tone:var(--neutral)} .t-accent{--tone:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:10px;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent);border:1px solid color-mix(in srgb,var(--tone) 35%,transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tone)}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}

/* Patente chilena */
.plate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--plate-line);border-radius:4px;padding:1px 7px 2px;line-height:1;min-width:84px;box-shadow:inset 0 0 0 2px var(--plate)}
.plate b{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.06em}
.plate i{font-style:normal;font-size:6.5px;letter-spacing:.35em;color:#555;margin-top:1px}
.plate.lg{min-width:150px;padding:4px 12px 5px}
.plate.lg b{font-size:26px}
.plate.lg i{font-size:9px}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;align-items:center;padding:9px 12px 9px 0;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.alert .stripe{background:var(--tone);border-radius:5px 0 0 5px;align-self:stretch;margin:-9px 0}
.alert .ah{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.alert .ah strong{font-weight:600;font-size:13.5px}
.alert p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.fbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.fbtn:focus-visible{outline:2px solid var(--accent)}
.fbtn b{font-family:var(--f-mono);font-weight:500;font-size:11px;margin-left:4px}

/* Botones */
.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Tablas */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:none;border-top:2px solid var(--line)}
.neg{color:var(--crit)} .pos{color:var(--ok)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:5px}

/* Inventario: tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vcard{all:unset;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);min-width:0}
.vcard:hover{border-color:var(--muted)}
.vcard:focus-visible{outline:2px solid var(--accent)}
.vphoto{aspect-ratio:16/9;max-width:100%;background:var(--surface-2);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vphoto img{width:100%;height:100%;object-fit:cover}
.vphoto svg{width:46%;opacity:.35;color:var(--muted)}
.vphoto .tag{position:absolute;top:8px;left:8px}
.vphoto .price{position:absolute;right:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-stretch:90%;font-weight:800;font-size:17px;padding:2px 9px;border-radius:3px;transform:rotate(-2deg);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.vbody{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px}
.vbody .t{font-weight:600;font-size:14.5px;line-height:1.25}
.vmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.days{font-family:var(--f-mono);font-size:11.5px;color:var(--tone,var(--muted))}
.agebar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.agebar i{display:block;height:100%;background:var(--tone,var(--ok))}

/* Kanban leads */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.col h3 span{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.lcard{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;border-left:3px solid var(--tone,var(--line))}
.lcard:hover{border-color:var(--muted);border-left-color:var(--tone,var(--muted))}
.lcard:focus-visible{outline:2px solid var(--accent)}
.lcard b{font-size:13.5px;font-weight:600}
.lcard .row{display:flex;justify-content:space-between;gap:6px;color:var(--muted);flex-wrap:wrap}

/* Ficha */
.ficha-h{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.ficha-h .ph{width:220px;max-width:100%;aspect-ratio:16/10;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.ficha-h .ph img{width:100%;height:100%;object-fit:cover}
.ficha-h .ph svg{width:50%;opacity:.35;color:var(--muted)}
.ficha-h .info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.ficha-h h2{font-size:26px}
dl.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 2px}
.flow span{font-size:11.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.flow span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.flow span.done{color:var(--ink);border-color:var(--muted)}
.flow em{color:var(--muted);font-style:normal;font-size:11px}
.check{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font-size:11.5px;padding:3px 9px;color:var(--muted)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--tone);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg button:disabled{cursor:default}
.waterfall{display:flex;flex-direction:column;gap:5px;font-size:13px}
.waterfall .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:3px 0}
.waterfall .ln.tot{border-top:2px solid var(--line);padding-top:7px;font-weight:600}
.waterfall .ln span:last-child{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px}
.callout{padding:10px 12px;border-radius:5px;background:color-mix(in srgb,var(--tone,var(--low)) 10%,transparent);border:1px solid color-mix(in srgb,var(--tone,var(--low)) 35%,transparent);font-size:12.5px}

/* Barras */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.bar-row .lbl{font-size:13px}
.bar-row .val{font-family:var(--f-mono);font-size:12px;text-align:right;grid-row:span 2;color:var(--muted)}
.bar{height:9px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tone,var(--accent))}

/* Formularios / modal */
.modal{position:fixed;inset:0;background:rgba(15,18,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.dialog header{padding:16px 20px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dialog header h2{font-size:21px}
.dialog .body{padding:16px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.dialog footer{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld input:not([type=checkbox]),.fld select,.fld textarea{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk label{color:var(--ink);font-size:13px}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:15px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fsec:first-child{border-top:none;padding-top:0;margin-top:0}
.ferr{grid-column:1/-1;color:var(--crit);font-size:12.5px}
input.search{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);min-width:0;width:220px;max-width:100%}
select.sel{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
pre.txt{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:12px;margin:0;max-height:55vh;overflow:auto;grid-column:1/-1}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.log{display:flex;flex-direction:column}
.log .it{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.log .it .mono{color:var(--muted)}

@media (max-width:1100px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip > div:nth-child(3){border-left:none}.strip > div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap;padding:6px 10px}
  .nav-sep,.side-foot{display:none}
  .top{padding:16px}
  main{padding:16px 16px 50px}
  .dialog .body{grid-template-columns:minmax(0,1fr)}
  .strip > div{padding:12px 14px}
  .big{font-size:30px}
}
@media (max-width:480px){.strip{grid-template-columns:minmax(0,1fr)}.strip > div + div{border-left:none;border-top:1px solid var(--line)}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="7" width="34" height="22" rx="3" fill="var(--plate)" stroke="var(--accent)" stroke-width="2"/><path d="M8 22.5l3-6.5h14l3 6.5" fill="none" stroke="var(--plate-ink)" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="23" r="2.2" fill="var(--plate-ink)"/><circle cx="24" cy="23" r="2.2" fill="var(--plate-ink)"/></svg>
      <div><b>Patio</b><small id="empresaNombre">VPAI · Automotora</small></div>

const per=id=>DB.personas.find(p=>p.id===id);
const vend=id=>DB.vendedores.find(u=>u.id===id);
const consDe=v=>DB.consignaciones.find(c=>c.vehiculoId===v.id);
const nomV=v=>v?`${v.marca} ${v.modelo} ${v.anio}`:'—';
const diasStock=v=>dias(v.ingreso,v.venta?.fecha||(v.estado==='devuelto'?v.cierre||HOY():HOY()));
const vence=c=>{const d=P(c.inicio);d.setDate(d.getDate()+(+c.plazo||0));return iso(d)};
const esMio=l=>UI.role!=='vendedor'||l.vendedorId===UI.vend||!l.vendedorId;
const can=a=>({
  editVeh:['gerencia','admin'],costos:['gerencia','admin'],config:['gerencia','admin'],consig:['gerencia','admin'],
  venta:['gerencia','admin','vendedor'],reserva:['gerencia','admin','vendedor'],entrega:['gerencia','admin'],legal:['gerencia','admin'],liquidar:['gerencia','admin']
}[a]||[]).includes(UI.role);

function comision(c,precio){if(!c)return 0;const x=c.comTipo==='pct'?precio*(+c.comValor||0)/100:(+c.comValor||0);return c.comTipo==='pct'?Math.max(x,+DB.cfg.comisionMinima||0):x}
function liquidacion(v){const c=consDe(v);if(!c)return null;const precio=v.venta?.precio||v.precio||0;const com=comision(c,precio);const cargos=sum(v.gastos.filter(g=>g.cargoConsignante),g=>g.monto);return {c,precio,com,cargos,aPagar:precio-com-cargos,bajoMinimo:precio<(+c.minimo||0)}}
/* Economía de la unidad: realizado si está vendida, proyectado al precio publicado si sigue en stock */
function econ(v){
  const cfg=DB.cfg,vendido=!!v.venta,precio=vendido?+v.venta.precio:+v.precio||0,d=diasStock(v);
  const gastosProp=sum(v.gastos.filter(g=>!g.cargoConsignante),g=>g.monto),comVend=+cfg.comisionVendedor||0;
  if(v.origen==='consignacion'){
    const ingreso=comision(consDe(v),precio),iva=ingreso*19/119,neto=ingreso-iva-gastosProp-comVend;
    return {vendido,precio,d,ingreso,costoCompra:0,gastosProp,comVend,iva,capitalCost:0,capital:gastosProp,neto,pct:precio?neto/precio:NaN,porDia:0};
  }
  const costo=+v.costoCompra||0,capital=costo+gastosProp,tasaDia=(+cfg.tasaCapital||0)/100/30;
  const iva=cfg.ivaMargen?Math.max(0,precio-costo)*19/119:0,capitalCost=capital*tasaDia*d;
  const neto=precio-costo-gastosProp-comVend-iva-capitalCost;
  return {vendido,precio,d,ingreso:precio,costoCompra:costo,gastosProp,comVend,iva,capitalCost,capital,neto,pct:precio?neto/precio:NaN,porDia:capital*tasaDia};
}
const ageTone=d=>d>=DB.cfg.diasStockCritico?'crit':d>=DB.cfg.diasStockAlerta?'high':d>=DB.cfg.diasStockAlerta*.66?'med':'ok';
const legalPend=v=>CHECKS.filter(c=>v.checklist?.[c.k]!=='ok');

/* ============ Motor de reglas (determinista) ============ */
const RULES=[
  ['AU-001','Capital inmovilizado','Unidad disponible o reservada sobre el umbral de días en stock. Crítica sobre el segundo umbral.','stock'],
  ['AU-002','Toma detenida','Vehículo en evaluación por más días de los permitidos.','legal'],
  ['AU-003','Observación legal','Prenda, multas u otra verificación marcada como observada.','legal'],
  ['AU-004','Consignación por vencer','Contrato vigente que vence dentro del aviso configurado, o ya vencido.','consig'],
  ['AU-005','Venta bajo el mínimo','Consignación vendida bajo el precio mínimo pactado con el dueño.','consig'],
  ['AU-006','Liquidación pendiente','Consignación vendida sin pago al consignante después del plazo.','consig'],
  ['AU-007','Lead sin contacto','Lead nuevo sin primer contacto dentro de las horas configuradas.','leads'],
  ['AU-008','Seguimiento vencido','Lead activo con fecha de seguimiento pasada.','leads'],
  ['AU-009','Margen bajo objetivo','Margen neto proyectado de una unidad propia bajo el objetivo.','stock'],
  ['AU-010','Entrega o transferencia pendiente','Unidad vendida sin entregar o sin transferencia inscrita después del plazo.','venta'],
  ['AU-011','Reserva prolongada','Reserva sin concretar después de los días configurados.','venta'],
  ['AU-012','Sin publicar','Unidad disponible sin aviso en ningún portal.','stock'],
  ['AU-013','Lead sin vendedor','Lead activo sin vendedor asignado.','leads'],
  ['AU-014','Crédito sin respuesta','Solicitud de crédito en evaluación sobre los días configurados.','venta'],
  ['AU-015','Interesado en auto vendido','Lead activo cuyo auto de interés ya se vendió: ofrecer alternativa.','leads']];
function evaluar(){
  const A=[],cfg=DB.cfg,add=(rule,sev,titulo,detalle,go,vendedorId)=>A.push({rule,sev,titulo,detalle,go,vendedorId,area:RULES.find(r=>r[0]===rule)[3]});
  for(const v of DB.vehiculos){
    const d=diasStock(v),go={view:'ficha',id:v.id},lbl=`${fmtPat(v.patente)} ${nomV(v)}`;
    if(['disponible','reservado'].includes(v.estado)){
      const e=econ(v);
      if(d>=cfg.diasStockCritico)add('AU-001','crit',`${lbl}: ${d} días en patio`,v.origen==='consignacion'?'Consignación estancada: revisar precio con el dueño.':`Capital de ${mm(e.capital)} detenido. Esperar cuesta ${clp(e.porDia)} por día.`,go);
      else if(d>=cfg.diasStockAlerta)add('AU-001','high',`${lbl}: ${d} días en patio`,v.origen==='consignacion'?'Proponer ajuste de precio al consignante.':`Capital de ${mm(e.capital)} detenido. Evaluar rebaja o campaña.`,go);
      if(v.origen!=='consignacion'&&isFinite(e.pct)&&e.pct*100<cfg.margenObjetivo)add('AU-009','med',`${lbl}: margen proyectado ${pct(e.pct)}`,`Objetivo ${cfg.margenObjetivo}%. Margen neto proyectado ${clp(e.neto)}.`,go);
    }
    if(v.estado==='disponible'&&!PORTALES.some(p=>v.publicado?.[p]))add('AU-012','med',`${lbl}: sin publicar`,`Lleva ${d} días disponible sin aviso en ningún portal${v.foto?'':' y sin foto'}.`,go);
    if(v.estado==='evaluacion'&&d>cfg.diasEvalMax)add('AU-002','high',`${lbl}: ${d} días en evaluación`,`${legalPend(v).length} verificaciones pendientes.`,go);
    if(STOCK.includes(v.estado)){const obs=CHECKS.filter(c=>v.checklist?.[c.k]==='obs');if(obs.length)add('AU-003',obs.some(c=>c.crit)?'crit':'high',`${lbl}: ${obs.map(c=>c.s).join(', ')} con observación`,v.obsLegal||'No publicar hasta resolver.',go)}
    if(v.reserva&&v.estado==='reservado'){const dr=dias(v.reserva.fecha);if(dr>cfg.diasReservaMax)add('AU-011','med',`${lbl}: reservado hace ${dr} días`,`Cliente ${per(v.reserva.clienteId)?.nombre||''}. Concretar venta o liberar.`,go,v.reserva.vendedorId)}
    if(v.venta){
      const dv=dias(v.venta.fecha);
      if(v.estado==='vendido'&&dv>cfg.diasEntregaMax)add('AU-010','med',`${lbl}: vendido hace ${dv} días sin entregar`,'Coordinar entrega con el cliente.',go,v.venta.vendedorId);
      if(v.venta.transferencia!=='inscrita'&&dv>cfg.diasEntregaMax*2)add('AU-010','high',`${lbl}: transferencia sin inscribir`,`Estado: ${TRANSF[v.venta.transferencia]?.[0]||'Pendiente'}. Van ${dv} días desde la venta.`,go);
      if(v.venta.credito==='evaluacion'&&dias(v.venta.creditoFecha||v.venta.fecha)>cfg.diasCreditoMax)add('AU-014','med',`${lbl}: crédito ${v.venta.financiera} sin respuesta`,'Llamar a la financiera.',go,v.venta.vendedorId);
    }
  }
  for(const c of DB.consignaciones){
    const v=veh(c.vehiculoId);if(!v)continue;const go={view:'ficha',id:v.id},lbl=`${fmtPat(v.patente)} ${nomV(v)}`;
    if(c.estado==='vigente'&&STOCK.includes(v.estado)){const r=dias(HOY(),vence(c));if(r<0)add('AU-004','high',`${lbl}: consignación vencida hace ${nd(-r)}`,`Renovar contrato con ${per(c.consignanteId)?.nombre} o devolver el auto.`,go);else if(r<=cfg.diasAvisoConsig)add('AU-004','med',`${lbl}: consignación vence en ${nd(r)}`,`Contactar a ${per(c.consignanteId)?.nombre} para renovar o ajustar precio.`,go)}
    if(v.venta&&c.estado!=='liquidada'){
      const lq=liquidacion(v);
      if(lq.bajoMinimo)add('AU-005','high',`${lbl}: vendido ${clp(lq.precio)} bajo el mínimo de ${clp(c.minimo)}`,'Requiere autorización escrita del consignante.',go);
      const dv=dias(v.venta.fecha);if(dv>cfg.diasLiquidacion)add('AU-006','high',`${lbl}: liquidación pendiente hace ${dv} días`,`Pagar ${clp(lq.aPagar)} a ${per(c.consignanteId)?.nombre}.`,go);
      else add('AU-006','low',`${lbl}: liquidar al consignante`,`${clp(lq.aPagar)} a ${per(c.consignanteId)?.nombre}. Plazo ${cfg.diasLiquidacion} días.`,go);
    }
  }
  for(const l of DB.leads){
    if(['ganado','perdido'].includes(l.etapa))continue;const go={view:'lead',id:l.id};
    if(l.etapa==='nuevo'&&!l.contactos.length&&horas(l.creado)>cfg.horasSinContacto)add('AU-007','high',`${l.nombre}: ${Math.floor(horas(l.creado))} h sin contacto`,`Lead de ${l.canal}${l.vehiculoId?' por '+nomV(veh(l.vehiculoId)):''}.`,go,l.vendedorId);
    if(!l.vendedorId)add('AU-013','high',`${l.nombre}: sin vendedor asignado`,`Lead de ${l.canal}. Asignar ahora.`,go);
    if(l.prox&&dias(l.prox)>0)add('AU-008','med',`${l.nombre}: seguimiento vencido hace ${nd(dias(l.prox))}`,`${ETAPAS[l.etapa][0]}${l.vehiculoId?' · '+nomV(veh(l.vehiculoId)):''}.`,go,l.vendedorId);
    const lv=veh(l.vehiculoId);if(lv&&['vendido','entregado','devuelto'].includes(lv.estado))add('AU-015','med',`${l.nombre}: el ${nomV(lv)} ya no está disponible`,'Ofrecer una alternativa del stock.',go,l.vendedorId);
  }
  return A.sort((a,b)=>SEV[a.sev][2]-SEV[b.sev][2]);
}
function alertasRol(A){
  if(UI.role==='vendedor')return A.filter(a=>['leads','venta'].includes(a.area)||a.rule==='AU-012').filter(a=>!a.vendedorId||a.vendedorId===UI.vend);
  if(UI.role==='admin')return A.filter(a=>a.area!=='leads'||a.rule==='AU-013');
  return A;
}

/* ============ Flujo de estados del vehículo ============ */
function validar(v,dest){
  const err=[],av=[];
  if(!TRANS[v.estado].includes(dest))err.push(`No se puede pasar de ${ESTADOS[v.estado][0]} a ${ESTADOS[dest][0]}.`);
  if(dest==='disponible'){
    CHECKS.filter(c=>c.crit&&v.checklist?.[c.k]!=='ok').forEach(c=>err.push(`Verificación obligatoria sin aprobar: ${c.l}.`));
    CHECKS.filter(c=>!c.crit&&v.checklist?.[c.k]==='obs').forEach(c=>err.push(`Verificación observada: ${c.l}.`));
    CHECKS.filter(c=>!c.crit&&v.checklist?.[c.k]==='pend').forEach(c=>av.push(`Pendiente: ${c.l}.`));
    if(!(+v.precio>0))err.push('Falta el precio de publicación.');
    if(v.origen!=='consignacion'&&!(+v.costoCompra>0))err.push('Falta el costo de compra o tasación.');
    if(v.origen==='consignacion'&&!consDe(v))err.push('Falta el contrato de consignación.');
  }
  return {err,av};
}
function transicion(v,dest,datos={},motivo=''){
  const {err}=validar(v,dest);if(err.length)return err;
  const antes=v.estado;v.estado=dest;const c=consDe(v);
  if(dest==='reservado')v.reserva=datos;
  if(dest==='disponible'&&antes==='reservado'){log(`Reserva liberada (${motivo||'sin motivo'})`,v.id);v.reserva=null}
  if(dest==='vendido'){v.venta=datos;if(c)c.estado='vendida';
    if(datos.leadId){const l=DB.leads.find(x=>x.id===datos.leadId);if(l){l.etapa='ganado';l.prox=''}}}
  if(dest==='entregado')v.venta.entrega=datos.entrega||HOY();
  if(dest==='devuelto'){v.cierre=HOY();v.motivoCierre=motivo;if(c&&c.estado==='vigente')c.estado='devuelta'}
  log(`VEHICULO_${dest.toUpperCase()}: ${ESTADOS[antes][0]} → ${ESTADOS[dest][0]}${motivo&&dest!=='disponible'?' ('+motivo+')':''}`,v.id);
  return null;
}

/* ============ Centro de control ============ */
function vControl(RA){

    const misV=vMes.filter(v=>v.venta.vendedorId===UI.vend);
    strip=`<div><div class="eyebrow">Leads activos</div><div class="big">${act.length}</div><div class="note">${act.filter(l=>l.etapa==='negociacion').length} en negociación</div></div>
    <div><div class="eyebrow">Seguimientos para hoy</div><div class="big" style="color:${hoy.length?'var(--high)':'inherit'}">${hoy.length}</div><div class="note">${hoy.filter(l=>dias(l.prox)>0).length} atrasados</div></div>
    <div><div class="eyebrow">Mis ventas del mes</div><div class="big">${misV.length}</div><div class="note">${mm(sum(misV,v=>v.venta.precio))} vendidos</div></div>
    <div><div class="eyebrow">Tasa de cierre</div><div class="big">${cerr.length?Math.round(gan.length/cerr.length*100):0}<small>%</small></div><div class="note">${gan.length} ganados de ${cerr.length} cerrados</div></div>`;
    right=`<section class="panel"><div class="panel-h"><div><h2>Mi agenda de seguimiento</h2><p>Leads con seguimiento para hoy o atrasado.</p></div><button class="btn sm pri" data-act="new" data-tipo="lead">Nuevo lead</button></div>${tbl(['Lead','Etapa','Seguimiento'],hoy.map(l=>`<tr data-act="go" data-view="lead" data-id="${l.id}"><td>${esc(l.nombre)}<span class="sub">${l.vehiculoId?esc(nomV(veh(l.vehiculoId))):'Sin auto específico'} · ${esc(l.canal)}</span></td><td>${pill(...ETAPAS[l.etapa])}</td><td class="num">${dias(l.prox)>0?pill('Hace '+dias(l.prox)+' d','crit'):pill('Hoy','med')}</td></tr>`),'Sin seguimientos pendientes para hoy.')}</section>
    <section class="panel"><div class="panel-h"><div><h2>Mi embudo</h2><p>Leads por etapa.</p></div></div>${bars(Object.entries(ETAPAS).map(([k,[l,t]])=>({l,t,v:mis.filter(x=>x.etapa===k).length})))}</section>`;
  }else if(UI.role==='admin'){
    const ev=DB.vehiculos.filter(v=>v.estado==='evaluacion');
    const liq=DB.vehiculos.filter(v=>v.venta&&consDe(v)&&consDe(v).estado!=='liquidada').map(liquidacion);
    const ent=DB.vehiculos.filter(v=>v.venta&&(v.estado==='vendido'||v.venta.transferencia!=='inscrita'));
    const porV=DB.consignaciones.filter(c=>c.estado==='vigente'&&STOCK.includes(veh(c.vehiculoId)?.estado)&&dias(HOY(),vence(c))<=DB.cfg.diasAvisoConsig);
    strip=`<div><div class="eyebrow">Tomas en evaluación</div><div class="big">${ev.length}</div><div class="note">${sum(ev,v=>legalPend(v).length)} verificaciones pendientes</div></div>
    <div><div class="eyebrow">Por pagar a consignantes</div><div class="big">${mm(sum(liq,l=>l.aPagar))}</div><div class="note">${liq.length} liquidaciones</div></div>
    <div><div class="eyebrow">Entregas y transferencias</div><div class="big">${ent.length}</div><div class="note">${ent.filter(v=>v.estado==='vendido').length} por entregar</div></div>
    <div><div class="eyebrow">Consignaciones por vencer</div><div class="big">${porV.length}</div><div class="note">Aviso a ${DB.cfg.diasAvisoConsig} días</div></div>`;
    right=`<section class="panel"><div class="panel-h"><div><h2>Tomas por aprobar</h2><p>Verificación legal antes de publicar.</p></div></div>${tbl(['Vehículo','Pendientes','Días'],ev.map(v=>`<tr data-act="go" data-view="ficha" data-id="${v.id}"><td>${plate(v.patente)} <span class="sub">${esc(nomV(v))} · ${ORIGEN[v.origen][0]}</span></td><td>${legalPend(v).length} de ${CHECKS.length}</td><td class="r">${diasStock(v)}</td></tr>`),'Sin tomas en evaluación.')}</section>
    <section class="panel"><div class="panel-h"><div><h2>Ventas en trámite</h2><p>Entrega, crédito y transferencia.</p></div></div>${tbl(['Vehículo','Crédito','Transferencia'],ent.map(v=>`<tr data-act="go" data-view="ficha" data-id="${v.id}"><td>${plate(v.patente)}<span class="sub">${esc(nomV(v))} · ${estPill(v)}</span></td><td>${v.venta.credito?pill(...CREDITO[v.venta.credito]):'<span class="muted">Contado</span>'}</td><td>${pill(...TRANSF[v.venta.transferencia||'pendiente'])}</td></tr>`),'Sin ventas en trámite.')}</section>`;
  }else{
    const cap=sum(E,e=>e.capital),dia=sum(E,e=>e.porDia),dprom=pub.length?Math.round(sum(pub,diasStock)/pub.length):0;
    const netoMes=sum(vMes.map(econ),e=>e.neto);
    strip=`<div><div class="eyebrow">Autos en patio</div><div class="big">${pub.length}</div><div class="note">${DB.vehiculos.filter(v=>v.estado==='evaluacion').length} más en evaluación · ${pub.filter(v=>v.origen==='consignacion').length} en consignación</div></div>
    <div><div class="eyebrow">Capital inmovilizado</div><div class="big">${mm(cap)}</div><div class="note">Esperar cuesta ${clp(dia)} por día</div></div>
    <div><div class="eyebrow">Días promedio en stock</div><div class="big" style="color:var(--${ageTone(dprom)==='ok'?'ink':ageTone(dprom)})">${dprom}<small>días</small></div><div class="note">Alerta a los ${DB.cfg.diasStockAlerta}, crítico a los ${DB.cfg.diasStockCritico}</div></div>
    <div><div class="eyebrow">Ventas del mes</div><div class="big">${vMes.length}<small>unid.</small></div><div class="note">Margen neto ${mm(netoMes)}</div></div>`;
    const B=buckets();
    right=`<section class="panel"><div class="panel-h"><div><h2>Antigüedad del stock</h2><p>Capital propio detenido por tramo de días. Las consignaciones solo suman sus gastos.</p></div></div>${bars(B.map(b=>({l:`${b.l} · ${b.n} ${b.n===1?'auto':'autos'}`,t:b.t,v:b.v})),r=>mm(r.v))}</section>
    <section class="panel"><div class="panel-h"><div><h2>Embudo de leads</h2><p>Todos los vendedores.</p></div><button class="btn sm" data-act="nav" data-view="leads">Ver leads</button></div>${bars(Object.entries(ETAPAS).map(([k,[l,t]])=>({l,t,v:DB.leads.filter(x=>x.etapa===k).length})))}</section>`;
  }
  return `<section class="strip">${strip}</section>
  <div class="grid2"><section class="panel"><div class="panel-h"><div><h2>Qué requiere atención</h2><p>Alertas del motor de reglas, de mayor a menor severidad. El código indica la regla que la generó.</p></div>
  <div class="filters"><button class="fbtn" data-act="aarea" data-a="" aria-pressed="${!area}">Todas<b>${RA.length}</b></button>${areas.map(a=>`<button class="fbtn" data-act="aarea" data-a="${a}" aria-pressed="${area===a}">${AREAS[a]}<b>${RA.filter(x=>x.area===a).length}</b></button>`).join('')}</div></div>${alertList(list,12)}</section>
  <div class="stack">${right}</div></div>`;
}

/* ============ Inventario ============ */
function vcard(v){
  const d=diasStock(v),t=ageTone(d),inS=STOCK.includes(v.estado),pr=v.venta?.precio||v.precio;
  return `<button class="vcard" data-act="go" data-view="ficha" data-id="${v.id}"><div class="vphoto">${v.foto?`<img src="${v.foto}" alt="${esc(nomV(v))}">`:CAR}<span class="tag">${estPill(v)}</span>${pr?`<span class="price">${mm(pr)}</span>`:''}</div>
  <div class="vbody"><div class="vfoot">${plate(v.patente)}${oriPill(v)}</div><div class="t">${esc(v.marca)} ${esc(v.modelo)} <span class="muted" style="font-weight:400">${esc(v.version)}</span></div>
  <div class="vmeta"><span>${v.anio}</span><span>${(+v.km||0).toLocaleString('es-CL')} km</span><span>${esc(v.transmision)}</span><span>${esc(v.combustible)}</span></div>
  ${inS?`<div class="t-${t}"><div class="vfoot"><span class="days">${d} días en patio</span><span class="days" style="color:var(--muted)">${esc(v.ubicacion)}</span></div><div class="agebar"><i style="width:${Math.min(100,d/DB.cfg.diasStockCritico*100)}%"></i></div></div>`:`<div class="days">${v.venta?'Vendido el '+fdate(v.venta.fecha)+' · '+d+' días':'Cerrado el '+fdate(v.cierre)}</div>`}</div></button>`;
}
function vInventario(){
  const f=UI.inv,q=UI.q.toLowerCase();
  const filt=v=>(f==='todos'||(f==='stock'?STOCK.includes(v.estado):v.estado===f))&&(!UI.invOrigen||v.origen===UI.invOrigen)&&(!q||[v.patente,v.marca,v.modelo,v.version,v.vin].join(' ').toLowerCase().includes(q.replace(/[·\-\s]/g,''))||[v.marca,v.modelo].join(' ').toLowerCase().includes(q));
  const vs=DB.vehiculos.filter(filt).sort((a,b)=>FLUJO.indexOf(a.estado)-FLUJO.indexOf(b.estado)||diasStock(b)-diasStock(a));
  const n=k=>DB.vehiculos.filter(v=>k==='todos'||(k==='stock'?STOCK.includes(v.estado):v.estado===k)).length;
  const fl=[['stock','En patio'],...Object.entries(ESTADOS).map(([k,[l]])=>[k,l]),['todos','Todos']];
  return `<section class="panel"><div class="panel-h"><div class="filters">${fl.map(([k,l])=>`<button class="fbtn" data-act="inv" data-f="${k}" aria-pressed="${f===k}">${l}<b>${n(k)}</b></button>`).join('')}</div>
  <div class="actions"><input class="search" id="invQ" type="search" placeholder="Buscar patente, marca, modelo" value="${esc(UI.q)}" aria-label="Buscar"><select class="sel" id="invO" aria-label="Origen"><option value="">Todo origen</option>${Object.entries(ORIGEN).map(([k,[l]])=>`<option value="${k}" ${UI.invOrigen===k?'selected':''}>${l}</option>`).join('')}</select>
  ${can('editVeh')?`<button class="btn" data-act="new" data-tipo="consigNueva">Ingresar consignación</button><button class="btn pri" data-act="new" data-tipo="compra">Registrar compra</button>`:''}</div></div>
  ${vs.length?`<div class="cards">${vs.map(vcard).join('')}</div>`:'<div class="empty">No hay vehículos con este filtro.</div>'}</section>`;
}

/* ============ Ficha del vehículo ============ */
function vFicha(v){
  const d=diasStock(v),c=consDe(v),E=econ(v),costos=can('costos');
  const idx=FLUJO.indexOf(v.estado);
  const flow=v.estado==='devuelto'?`<div class="flow"><span class="on">Devuelto / rechazado</span><em>${esc(v.motivoCierre||'')}</em></div>`:`<div class="flow">${FLUJO.map((k,i)=>`<span class="${i===idx?'on':i<idx?'done':''}">${ESTADOS[k][0]}</span>${i<FLUJO.length-1?'<em>›</em>':''}`).join('')}</div>`;
  const B=[];const T=(to,l,pri)=>B.push(`<button class="btn ${pri?'pri':''}" data-act="trans" data-to="${to}" data-id="${v.id}">${l}</button>`);
  if(v.estado==='evaluacion'&&can('editVeh')){T('disponible','Aprobar y publicar',1);T('devuelto',v.origen==='consignacion'?'Rechazar consignación':'Rechazar toma')}
  if(v.estado==='disponible'){if(can('venta'))T('vendido','Registrar venta',1);if(can('reserva'))T('reservado','Registrar reserva');if(can('editVeh')){T('evaluacion','Volver a evaluación');if(v.origen==='consignacion')T('devuelto','Devolver al consignante')}}
  if(v.estado==='reservado'){if(can('venta'))T('vendido','Registrar venta',1);T('disponible','Liberar reserva')}
  if(v.estado==='vendido'&&can('entrega'))T('entregado','Registrar entrega',1);
  const head=`<section class="panel"><div class="ficha-h"><button class="ph" data-act="foto" data-id="${v.id}" ${can('editVeh')?'':'disabled'} title="${can('editVeh')?'Subir o cambiar foto':''}" style="cursor:${can('editVeh')?'pointer':'default'};padding:0">${v.foto?`<img src="${v.foto}" alt="${esc(nomV(v))}">`:CAR}</button>
  <div class="info"><div class="actions">${plate(v.patente,1)}${estPill(v)}${oriPill(v)}</div><h2>${esc(v.marca)} ${esc(v.modelo)} <span class="muted" style="font-weight:500">${esc(v.version)}</span></h2>
  <div class="vmeta" style="font-size:13px"><span>${v.anio}</span><span>${(+v.km||0).toLocaleString('es-CL')} km</span><span>${esc(v.color)}</span><span>${esc(v.transmision)}</span><span>${esc(v.combustible)}</span><span>${esc(v.ubicacion)}</span></div>
  ${flow}</div>
  <div style="text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="eyebrow">${v.venta?'Precio de venta':'Precio publicado'}</span><span class="big">${v.venta?clp(v.venta.precio):v.precio?clp(v.precio):'Sin precio'}</span><span class="days t-${STOCK.includes(v.estado)?ageTone(d):'neutral'}" style="color:var(--tone)">${d} días ${v.venta?'hasta la venta':'en patio'}</span></div></div>
  <div class="actions" style="margin-top:14px">${B.join('')}${can('editVeh')?`<button class="btn" data-act="edit" data-tipo="veh" data-id="${v.id}">Editar ficha</button>`:''}<button class="btn" data-act="aviso" data-id="${v.id}">Copiar aviso</button><button class="btn" data-act="nav" data-view="inventario">Volver al inventario</button></div></section>`;

  const datos=`<section class="panel"><div class="panel-h"><h2>Datos del vehículo</h2></div><dl class="kv">
    <dt>Patente</dt><dd class="mono">${esc(fmtPat(v.patente))}</dd><dt>VIN</dt><dd class="mono">${esc(v.vin)||'—'}</dd>
    <dt>Ingreso</dt><dd>${fdate(v.ingreso)}</dd>${v.proveedorId?`<dt>${v.origen==='parte_pago'?'Entregado por':'Comprado a'}</dt><dd>${esc(per(v.proveedorId)?.nombre)}</dd>`:''}
    ${costos&&v.origen!=='consignacion'?`<dt>${v.origen==='parte_pago'?'Tasación':'Costo de compra'}</dt><dd class="num">${clp(v.costoCompra)}</dd>`:''}
    ${v.notas?`<dt>Notas</dt><dd>${esc(v.notas)}</dd>`:''}</dl></section>`;

  const legal=`<section class="panel"><div class="panel-h"><div><h2>Verificación legal e inspección</h2><p>Las marcadas como obligatorias deben estar en OK para publicar.</p></div><span>${legalPend(v).length?pill(legalPend(v).length+' pendientes','high'):pill('Completa','ok')}</span></div>
  ${v.obsLegal?`<div class="callout t-crit" style="margin-bottom:8px">${esc(v.obsLegal)}</div>`:''}
  ${CHECKS.map(ch=>{const s=v.checklist?.[ch.k]||'pend';return `<div class="check"><span>${esc(ch.l)}${ch.crit?' <span class="chip">Obligatoria</span>':''}</span><span class="seg">${Object.entries(CHK_EST).map(([k,[l,t]])=>`<button class="t-${t}" data-act="chk" data-id="${v.id}" data-k="${ch.k}" data-val="${k}" aria-pressed="${s===k}" ${can('legal')?'':'disabled'}>${l}</button>`).join('')}</span></div>`}).join('')}</section>`;

  const gastos=costos?`<section class="panel"><div class="panel-h"><div><h2>Reacondicionamiento y gastos</h2><p>Mecánica, pintura, detailing, trámites. ${c?'Marca los que se descuentan al consignante.':''}</p></div>${can('editVeh')?`<button class="btn sm pri" data-act="new" data-tipo="gasto" data-id="${v.id}">Agregar gasto</button>`:''}</div>
  ${tbl(['Fecha','Tipo','Detalle','>Monto'],v.gastos.map(g=>`<tr data-act="edit" data-tipo="gasto" data-id="${v.id}" data-sub="${g.id}"><td class="num">${fdate(g.fecha)}</td><td>${esc(g.tipo)}${g.cargoConsignante?' <span class="chip">Cargo consignante</span>':''}</td><td>${esc(g.desc)}</td><td class="r">${clp(g.monto)}</td></tr>`),'Sin gastos registrados.',v.gastos.length?`<tr><td colspan="3">Total</td><td class="r">${clp(sum(v.gastos,g=>g.monto))}</td></tr>`:'')}</section>`:'';

  const intLeads=DB.leads.filter(l=>l.vehiculoId===v.id);
  const leads=`<section class="panel"><div class="panel-h"><div><h2>Leads interesados</h2><p>Consultas asociadas a este auto.</p></div><button class="btn sm" data-act="new" data-tipo="lead" data-id="${v.id}">Nuevo lead</button></div>${tbl(['Lead','Etapa','Vendedor'],intLeads.map(l=>`<tr data-act="go" data-view="lead" data-id="${l.id}"><td>${esc(l.nombre)}<span class="sub">${esc(l.canal)}</span></td><td>${pill(...ETAPAS[l.etapa])}</td><td>${esc(vend(l.vendedorId)?.nombre||'Sin asignar')}</td></tr>`),'Sin leads para este auto.')}</section>`;

  const wf=costos&&(E.precio>0)?`<section class="panel"><div class="panel-h"><div><h2>Rentabilidad de la unidad</h2><p>${E.vendido?'Resultado realizado con el precio de venta.':'Proyección al precio publicado si se vende hoy.'}</p></div>${pill(pct(E.pct),v.origen==='consignacion'?'neutral':E.pct*100<DB.cfg.margenObjetivo?'high':'ok')}</div><div class="waterfall">
  ${v.origen==='consignacion'?`<div class="ln"><span>Precio de ${E.vendido?'venta':'publicación'}</span><span>${clp(E.precio)}</span></div><div class="ln"><span>Comisión de la automotora</span><span>${clp(E.ingreso)}</span></div><div class="ln"><span>− IVA de la comisión</span><span>${clp(-E.iva)}</span></div>`
  :`<div class="ln"><span>Precio de ${E.vendido?'venta':'publicación'}</span><span>${clp(E.precio)}</span></div><div class="ln"><span>− ${v.origen==='parte_pago'?'Tasación de parte de pago':'Costo de compra'}</span><span>${clp(-E.costoCompra)}</span></div>`}
  <div class="ln"><span>− Reacondicionamiento y gastos</span><span>${clp(-E.gastosProp)}</span></div><div class="ln"><span>− Comisión del vendedor</span><span>${clp(-E.comVend)}</span></div>
  ${v.origen!=='consignacion'?`${DB.cfg.ivaMargen?`<div class="ln"><span>− IVA sobre el margen</span><span>${clp(-E.iva)}</span></div>`:''}<div class="ln"><span>− Costo del capital (${E.d} días al ${DB.cfg.tasaCapital}% mensual)</span><span>${clp(-E.capitalCost)}</span></div>`:''}
  <div class="ln tot"><span>Margen neto</span><span class="${E.neto<0?'neg':''}">${clp(E.neto)}</span></div></div>
  ${!E.vendido&&E.porDia?`<div class="callout t-${ageTone(d)}" style="margin-top:12px">Cada día adicional en patio le resta ${clp(E.porDia)} al margen.</div>`:''}</section>`:'';

  let cons='';
  if(c){const lq=liquidacion(v),r=dias(HOY(),vence(c)),p=per(c.consignanteId);
    cons=`<section class="panel"><div class="panel-h"><div><h2>Consignación</h2><p>Contrato con ${esc(p?.nombre)}.</p></div>${pill({vigente:'Vigente',vendida:'Vendida, por liquidar',liquidada:'Liquidada',devuelta:'Devuelta'}[c.estado],{vigente:'low',vendida:'high',liquidada:'ok',devuelta:'neutral'}[c.estado])}</div>
    <dl class="kv"><dt>Consignante</dt><dd>${esc(p?.nombre)}<span class="sub">${esc(p?.rut)} · ${esc(p?.telefono)}</span></dd>
    <dt>Plazo</dt><dd>${c.plazo} días desde ${fdate(c.inicio)}${c.estado==='vigente'?` · ${r<0?pill('Vencida hace '+(-r)+' d','crit'):r<=DB.cfg.diasAvisoConsig?pill('Vence en '+r+' d','high'):pill('Vence '+fdate(vence(c)),'neutral')}`:''}</dd>
    <dt>Precio mínimo</dt><dd class="num">${clp(c.minimo)}</dd><dt>Comisión</dt><dd>${c.comTipo==='pct'?`${c.comValor}% del precio (mínimo ${clp(DB.cfg.comisionMinima)})`:`Fija ${clp(c.comValor)}`}</dd></dl>
    <div class="eyebrow" style="margin:14px 0 6px">${v.venta?'Liquidación':'Liquidación estimada al precio publicado'}</div>
    <div class="waterfall"><div class="ln"><span>Precio de ${v.venta?'venta':'publicación'}</span><span>${clp(lq.precio)}</span></div><div class="ln"><span>− Comisión</span><span>${clp(-lq.com)}</span></div><div class="ln"><span>− Gastos a cargo del consignante</span><span>${clp(-lq.cargos)}</span></div><div class="ln tot"><span>A pagar al consignante</span><span>${clp(lq.aPagar)}</span></div></div>
    ${lq.bajoMinimo?`<div class="callout t-crit" style="margin-top:10px">El precio está bajo el mínimo pactado. Se necesita autorización escrita del consignante.</div>`:''}
    ${c.liq?`<div class="callout t-ok" style="margin-top:10px">Pagado ${clp(c.liq.monto)} el ${fdate(c.liq.fecha)} por ${esc(c.liq.medio)}.</div>`:''}
    <div class="actions" style="margin-top:12px"><button class="btn sm" data-act="contrato" data-id="${c.id}">Copiar contrato</button>${can('consig')&&c.estado==='vigente'?`<button class="btn sm" data-act="edit" data-tipo="contrato" data-id="${c.id}">Editar condiciones</button>`:''}${v.venta?`<button class="btn sm" data-act="liqTxt" data-id="${v.id}">Copiar liquidación</button>`:''}${v.venta&&c.estado==='vendida'&&can('liquidar')?`<button class="btn sm pri" data-act="new" data-tipo="liq" data-id="${v.id}">Registrar pago al consignante</button>`:''}</div></section>`}

  let venta='';
  if(v.reserva&&v.estado==='reservado'){const r=v.reserva;venta=`<section class="panel"><div class="panel-h"><div><h2>Reserva</h2><p>Hace ${dias(r.fecha)} días.</p></div>${pill('Reservado','accent')}</div><dl class="kv"><dt>Cliente</dt><dd>${esc(per(r.clienteId)?.nombre)}<span class="sub">${esc(per(r.clienteId)?.telefono||'')}</span></dd><dt>Vendedor</dt><dd>${esc(vend(r.vendedorId)?.nombre)}</dd><dt>Abono</dt><dd class="num">${clp(r.monto)}</dd><dt>Fecha</dt><dd>${fdate(r.fecha)}</dd></dl></section>`}
  if(v.venta){const s=v.venta,pp=veh(s.parteDePagoId),ed=can('entrega');
    venta=`<section class="panel"><div class="panel-h"><div><h2>Venta</h2><p>${fdate(s.fecha)}${s.entrega?' · entregado el '+fdate(s.entrega):''}</p></div>${estPill(v)}</div><dl class="kv">
    <dt>Cliente</dt><dd>${esc(per(s.clienteId)?.nombre)}<span class="sub">${esc(per(s.clienteId)?.rut||'')} ${esc(per(s.clienteId)?.telefono||'')}</span></dd><dt>Vendedor</dt><dd>${esc(vend(s.vendedorId)?.nombre)}</dd>
    <dt>Precio</dt><dd class="num">${clp(s.precio)}</dd><dt>Forma de pago</dt><dd>${PAGO[s.pago]||'—'}${s.financiera?` · ${esc(s.financiera)} por ${clp(s.montoFinanciado)}`:''}</dd>
    ${pp?`<dt>Parte de pago</dt><dd><button class="btn sm" data-act="go" data-view="ficha" data-id="${pp.id}">${esc(fmtPat(pp.patente))} ${esc(nomV(pp))}</button></dd>`:''}</dl>
    ${s.financiera?`<div class="check" style="margin-top:8px"><span>Crédito</span><span class="seg">${Object.entries(CREDITO).map(([k,[l,t]])=>`<button class="t-${t}" data-act="cred" data-id="${v.id}" data-val="${k}" aria-pressed="${s.credito===k}" ${ed||UI.role==='vendedor'?'':'disabled'}>${l}</button>`).join('')}</span></div>`:''}
    <div class="check"><span>Transferencia</span><span class="seg">${Object.entries(TRANSF).map(([k,[l,t]])=>`<button class="t-${t}" data-act="transf" data-id="${v.id}" data-val="${k}" aria-pressed="${(s.transferencia||'pendiente')===k}" ${ed?'':'disabled'}>${l}</button>`).join('')}</span></div></section>`}

  const pub=`<section class="panel"><div class="panel-h"><div><h2>Publicación</h2><p>Marca dónde está publicado el aviso.</p></div><button class="btn sm" data-act="aviso" data-id="${v.id}">Copiar aviso</button></div><div class="filters">${PORTALES.map(p=>`<button class="fbtn" data-act="pub" data-id="${v.id}" data-p="${p}" aria-pressed="${!!v.publicado?.[p]}" ${can('editVeh')&&STOCK.includes(v.estado)?'':'disabled'}>${p}</button>`).join('')}</div></section>`;
  const hist=DB.bitacora.filter(b=>b.ref===v.id).slice(0,12);
  const his=`<section class="panel"><div class="panel-h"><h2>Historial</h2></div>${hist.length?`<div class="log">${hist.map(b=>`<div class="it"><span class="mono">${fdt(b.ts)}</span><span>${esc(b.accion)}<span class="sub">${esc(b.quien)}</span></span></div>`).join('')}</div>`:'<div class="empty">Sin movimientos registrados desde que se cargó la ficha.</div>'}</section>`;
  return head+`<div class="grid2"><div class="stack">${datos}${legal}${gastos}${leads}</div><div class="stack">${venta}${wf}${cons}${pub}${his}</div></div>`;
}

/* ============ Consignaciones ============ */
function vConsig(){
  const mes=HOY().slice(0,7);
  const vig=DB.consignaciones.filter(c=>c.estado==='vigente');
  const porV=vig.filter(c=>STOCK.includes(veh(c.vehiculoId)?.estado)&&dias(HOY(),vence(c))<=DB.cfg.diasAvisoConsig);
  const pend=DB.consignaciones.filter(c=>c.estado==='vendida').map(c=>veh(c.vehiculoId)).filter(Boolean);
  const comMes=sum(DB.consignaciones.map(c=>veh(c.vehiculoId)).filter(v=>v?.venta&&v.venta.fecha.slice(0,7)===mes),v=>liquidacion(v).com);
  const EST={vigente:['Vigente','low'],vendida:['Por liquidar','high'],liquidada:['Liquidada','ok'],devuelta:['Devuelta','neutral']};
  const rows=[...DB.consignaciones].sort((a,b)=>['vendida','vigente','liquidada','devuelta'].indexOf(a.estado)-['vendida','vigente','liquidada','devuelta'].indexOf(b.estado)).map(c=>{const v=veh(c.vehiculoId);if(!v)return '';const r=dias(HOY(),vence(c));const pr=v.venta?.precio||v.precio;
    return `<tr data-act="go" data-view="ficha" data-id="${v.id}"><td>${plate(v.patente)}</td><td>${esc(nomV(v))}<span class="sub">${ESTADOS[v.estado][0]}</span></td><td>${esc(per(c.consignanteId)?.nombre)}</td><td class="num">${fdate(c.inicio)}</td><td>${c.estado==='vigente'?(r<0?pill('Vencida '+(-r)+' d','crit'):r<=DB.cfg.diasAvisoConsig?pill(r+' días','high'):`<span class="num">${r} días</span>`):'—'}</td><td class="r">${clp(c.minimo)}</td><td class="r">${pr?clp(pr):'—'}</td><td class="r">${pr?clp(comision(c,pr)):'—'}</td><td>${pill(...EST[c.estado])}</td></tr>`});
  return `<section class="strip"><div><div class="eyebrow">Contratos vigentes</div><div class="big">${vig.length}</div><div class="note">${vig.filter(c=>veh(c.vehiculoId)?.estado==='evaluacion').length} en evaluación</div></div>
  <div><div class="eyebrow">Por vencer o vencidos</div><div class="big" style="color:${porV.length?'var(--high)':'inherit'}">${porV.length}</div><div class="note">Aviso a ${DB.cfg.diasAvisoConsig} días del vencimiento</div></div>
  <div><div class="eyebrow">Por pagar a dueños</div><div class="big">${mm(sum(pend,v=>liquidacion(v).aPagar))}</div><div class="note">${pend.length} liquidaciones</div></div>
  <div><div class="eyebrow">Comisiones del mes</div><div class="big">${mm(comMes)}</div><div class="note">Brutas, con IVA</div></div></section>
  <section class="panel"><div class="panel-h"><div><h2>Liquidaciones pendientes</h2><p>Se calculan solas al registrar la venta: precio menos comisión menos gastos a cargo del dueño.</p></div></div>
  ${tbl(['Vehículo','Consignante','Venta','>Precio','>Comisión','>Cargos','>A pagar',''],pend.map(v=>{const l=liquidacion(v);return `<tr><td>${plate(v.patente)}<span class="sub">${esc(nomV(v))}</span></td><td>${esc(per(l.c.consignanteId)?.nombre)}</td><td class="num">${fdate(v.venta.fecha)}<span class="sub">hace ${dias(v.venta.fecha)} días</span></td><td class="r">${clp(l.precio)}${l.bajoMinimo?'<span class="sub neg">Bajo el mínimo</span>':''}</td><td class="r">${clp(l.com)}</td><td class="r">${clp(l.cargos)}</td><td class="r"><b>${clp(l.aPagar)}</b></td><td class="r"><div class="actions" style="justify-content:flex-end"><button class="btn sm" data-act="liqTxt" data-id="${v.id}">Copiar</button>${can('liquidar')?`<button class="btn sm pri" data-act="new" data-tipo="liq" data-id="${v.id}">Registrar pago</button>`:''}</div></td></tr>`}),'No hay liquidaciones pendientes.')}</section>
  <section class="panel"><div class="panel-h"><div><h2>Contratos</h2><p>Todos los autos recibidos en consignación. Abre una fila para ver la ficha y la liquidación.</p></div>${can('consig')?`<button class="btn pri" data-act="new" data-tipo="consigNueva">Ingresar consignación</button>`:''}</div>
  ${tbl(['Patente','Vehículo','Consignante','Inicio','Vence','>Mínimo','>Precio','>Comisión','Estado'],rows,'Sin contratos de consignación.')}</section>`;
}

/* ============ Leads ============ */
function vLeads(){
  const q=UI.q.toLowerCase();
  const L=DB.leads.filter(esMio).filter(l=>(!UI.leadCanal||l.canal===UI.leadCanal)&&(!UI.leadVend||(UI.leadVend==='_'?!l.vendedorId:l.vendedorId===UI.leadVend))&&(!q||l.nombre.toLowerCase().includes(q)||String(l.telefono).includes(q)));
  const card=l=>{const v=veh(l.vehiculoId),venc=l.prox&&dias(l.prox)>0&&!['ganado','perdido'].includes(l.etapa),sc=l.etapa==='nuevo'&&!l.contactos.length&&horas(l.creado)>DB.cfg.horasSinContacto;
    const t=sc||venc||!l.vendedorId&&!['ganado','perdido'].includes(l.etapa)?'crit':l.prox&&dias(l.prox)===0?'med':'';
    return `<button class="lcard ${t?'t-'+t:''}" data-act="go" data-view="lead" data-id="${l.id}"><b>${esc(l.nombre)}</b><span>${v?`${esc(fmtPat(v.patente))} · ${esc(nomV(v))}`:'<span class="muted">Sin auto específico</span>'}</span>
    <div class="row"><span class="chip">${esc(l.canal)}</span><span>${esc(vend(l.vendedorId)?.nombre?.split(' ')[0]||'Sin asignar')}</span></div>
    <div class="row">${l.etapa==='perdido'?`<span>${esc(l.motivo)}</span>`:l.etapa==='ganado'?'<span>Venta cerrada</span>':sc?`<span style="color:var(--crit)">${Math.floor(horas(l.creado))} h sin contacto</span>`:l.prox?`<span style="color:${venc?'var(--crit)':'inherit'}">Seguimiento ${dias(l.prox)===0?'hoy':venc?'atrasado '+dias(l.prox)+' d':fdate(l.prox)}</span>`:`<span>Ingresó ${fdt(l.creado)}</span>`}</div></button>`};
  const canales=DB.canales;
  const stat=canales.map(c=>{const x=DB.leads.filter(l=>l.canal===c),g=x.filter(l=>l.etapa==='ganado').length,cer=x.filter(l=>['ganado','perdido'].includes(l.etapa)).length;return {c,n:x.length,g,cer}}).filter(s=>s.n);
  const vst=DB.vendedores.map(u=>{const x=DB.leads.filter(l=>l.vendedorId===u.id);return {u,act:x.filter(l=>!['ganado','perdido'].includes(l.etapa)).length,g:x.filter(l=>l.etapa==='ganado').length,atr:x.filter(l=>l.prox&&dias(l.prox)>0&&!['ganado','perdido'].includes(l.etapa)).length,v:DB.vehiculos.filter(v=>v.venta?.vendedorId===u.id&&v.venta.fecha.slice(0,7)===HOY().slice(0,7)).length}});
  return `<section class="panel"><div class="panel-h"><div class="actions"><input class="search" id="leadQ" type="search" placeholder="Buscar nombre o teléfono" value="${esc(UI.q)}" aria-label="Buscar lead">
  <select class="sel" id="leadC" aria-label="Canal"><option value="">Todos los canales</option>${canales.map(c=>`<option ${UI.leadCanal===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  ${UI.role!=='vendedor'?`<select class="sel" id="leadV" aria-label="Vendedor"><option value="">Todos los vendedores</option><option value="_" ${UI.leadVend==='_'?'selected':''}>Sin asignar</option>${DB.vendedores.map(u=>`<option value="${u.id}" ${UI.leadVend===u.id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select>`:''}</div>
  <button class="btn pri" data-act="new" data-tipo="lead">Nuevo lead</button></div>
  <div class="kanban">${Object.entries(ETAPAS).map(([k,[l]])=>{const x=L.filter(y=>y.etapa===k).sort((a,b)=>(a.prox||'9').localeCompare(b.prox||'9'));return `<div class="col"><h3>${l}<span>${x.length}</span></h3>${x.map(card).join('')||'<span class="muted" style="font-size:12px">Sin leads</span>'}</div>`}).join('')}</div></section>
  ${UI.role!=='vendedor'?`<div class="grid2"><section class="panel"><div class="panel-h"><div><h2>Conversión por canal</h2><p>Dónde conviene invertir en publicidad. La conversión considera solo leads cerrados.</p></div></div>${tbl(['Canal','>Leads','>Ganados','>Conversión'],stat.map(s=>`<tr><td>${esc(s.c)}</td><td class="r">${s.n}</td><td class="r">${s.g}</td><td class="r">${s.cer?Math.round(s.g/s.cer*100)+'%':'—'}</td></tr>`),'Sin datos.')}</section>
  <section class="panel"><div class="panel-h"><div><h2>Vendedores</h2><p>Carga activa y cierres del mes.</p></div></div>${tbl(['Vendedor','>Activos','>Atrasados','>Ganados','>Ventas mes'],vst.map(s=>`<tr><td>${esc(s.u.nombre)}</td><td class="r">${s.act}</td><td class="r ${s.atr?'neg':''}">${s.atr}</td><td class="r">${s.g}</td><td class="r">${s.v}</td></tr>`),'Sin vendedores.')}</section></div>`:''}`;
}

/* ============ Rentabilidad ============ */
function vRent(){
  const tab=UI.rentTab,stock=tab==='stock';
  const vs=DB.vehiculos.filter(v=>stock?['disponible','reservado'].includes(v.estado):!!v.venta);
  const rows=vs.map(v=>({v,e:econ(v)}));const k=UI.rentSort;
  rows.sort((a,b)=>k==='neto'?a.e.neto-b.e.neto:k==='pct'?(a.e.pct||0)-(b.e.pct||0):b.e.d-a.e.d);
  const tot=f=>sum(rows,r=>f(r.e));
  const bajo=rows.filter(r=>r.v.origen!=='consignacion'&&r.e.pct*100<DB.cfg.margenObjetivo).length;
  const strip=stock?`<div><div class="eyebrow">Capital inmovilizado</div><div class="big">${mm(tot(e=>e.capital))}</div><div class="note">${rows.length} unidades publicadas</div></div>
  <div><div class="eyebrow">Costo diario de esperar</div><div class="big">${clp(tot(e=>e.porDia))}</div><div class="note">Al ${DB.cfg.tasaCapital}% mensual</div></div>
  <div><div class="eyebrow">Margen neto proyectado</div><div class="big">${mm(tot(e=>e.neto))}</div><div class="note">Si todo se vende hoy al precio publicado</div></div>
  <div><div class="eyebrow">Bajo el objetivo</div><div class="big" style="color:${bajo?'var(--high)':'inherit'}">${bajo}<small>de ${rows.length}</small></div><div class="note">Unidades propias bajo el ${DB.cfg.margenObjetivo}% neto</div></div>`
  :`<div><div class="eyebrow">Unidades vendidas</div><div class="big">${rows.length}</div><div class="note">${rows.filter(r=>r.v.origen==='consignacion').length} en consignación</div></div>
  <div><div class="eyebrow">Margen neto realizado</div><div class="big">${mm(tot(e=>e.neto))}</div><div class="note">Sobre ventas por ${mm(tot(e=>e.precio))}</div></div>
  <div><div class="eyebrow">Margen promedio</div><div class="big">${pct(tot(e=>e.neto)/Math.max(1,tot(e=>e.precio)))}</div><div class="note">Neto sobre precio de venta</div></div>
  <div><div class="eyebrow">Días promedio a la venta</div><div class="big">${rows.length?Math.round(tot(e=>e.d)/rows.length):0}<small>días</small></div><div class="note">Desde el ingreso al patio</div></div>`;
  const byO=Object.entries(ORIGEN).map(([k,[l,t]])=>{const x=rows.filter(r=>r.v.origen===k);return {l:`${l} · ${x.length} unid.`,t,v:Math.max(0,sum(x,r=>r.e.neto)),real:sum(x,r=>r.e.neto)}}).filter(r=>r.l);
  return `<div class="filters"><button class="fbtn" data-act="rtab" data-t="stock" aria-pressed="${stock}">Stock actual (proyectado)</button><button class="fbtn" data-act="rtab" data-t="vendidos" aria-pressed="${!stock}">Vendidos (realizado)</button></div>
  <section class="strip">${strip}</section>
  <section class="panel"><div class="panel-h"><div><h2>${stock?'Unidades en patio':'Unidades vendidas'}</h2><p>Margen neto = precio − compra − gastos − comisión del vendedor − IVA − costo del capital. En consignación el ingreso es la comisión.</p></div>
  <select class="sel" id="rSort" aria-label="Ordenar"><option value="dias" ${k==='dias'?'selected':''}>Más días primero</option><option value="neto" ${k==='neto'?'selected':''}>Menor margen primero</option><option value="pct" ${k==='pct'?'selected':''}>Menor % primero</option></select></div>
  ${tbl(['Vehículo','Origen','>Días','>Precio','>Costo + gastos','>IVA','>Capital','>Margen neto','>%'],rows.map(({v,e})=>`<tr data-act="go" data-view="ficha" data-id="${v.id}"><td>${plate(v.patente)}<span class="sub">${esc(nomV(v))}</span></td><td>${oriPill(v)}</td><td class="r"><span class="days t-${stock?ageTone(e.d):'neutral'}" style="color:var(--tone)">${e.d}</span></td><td class="r">${clp(e.precio)}</td><td class="r">${clp(e.costoCompra+e.gastosProp+e.comVend)}</td><td class="r">${clp(e.iva)}</td><td class="r">${clp(e.capitalCost)}</td><td class="r ${e.neto<0?'neg':''}"><b>${clp(e.neto)}</b></td><td class="r">${pill(pct(e.pct),v.origen==='consignacion'?'neutral':e.pct*100<DB.cfg.margenObjetivo?'high':'ok')}</td></tr>`),stock?'No hay unidades publicadas.':'Aún no hay ventas.',rows.length?`<tr><td colspan="3">Total</td><td class="r">${clp(tot(e=>e.precio))}</td><td class="r">${clp(tot(e=>e.costoCompra+e.gastosProp+e.comVend))}</td><td class="r">${clp(tot(e=>e.iva))}</td><td class="r">${clp(tot(e=>e.capitalCost))}</td><td class="r">${clp(tot(e=>e.neto))}</td><td class="r">${pct(tot(e=>e.neto)/Math.max(1,tot(e=>e.precio)))}</td></tr>`:'')}</section>
  <div class="grid2">${stock?`<section class="panel"><div class="panel-h"><div><h2>Capital por antigüedad</h2><p>Dónde está detenido el dinero.</p></div></div>${bars(buckets().map(b=>({l:`${b.l} · ${b.n} ${b.n===1?'auto':'autos'}`,t:b.t,v:b.v})),r=>mm(r.v))}</section>`:`<section class="panel"><div class="panel-h"><div><h2>Margen neto por origen</h2><p>Compra propia frente a consignación y parte de pago.</p></div></div>${bars(byO,r=>mm(r.real))}</section>`}
  <section class="panel"><div class="panel-h"><div><h2>Supuestos del cálculo</h2><p>Se ajustan en Configuración.</p></div></div><dl class="kv"><dt>Costo del capital</dt><dd>${DB.cfg.tasaCapital}% mensual sobre compra más gastos</dd><dt>Comisión vendedor</dt><dd>${clp(DB.cfg.comisionVendedor)} por unidad</dd><dt>IVA compra propia</dt><dd>${DB.cfg.ivaMargen?'19% sobre la diferencia entre venta y compra (régimen de margen para usados)':'No se descuenta'}</dd><dt>IVA consignación</dt><dd>19% sobre la comisión, que es el servicio facturado</dd><dt>Montos</dt><dd>Con IVA incluido, tal como se pagan y cobran</dd></dl><div class="callout t-low" style="margin-top:12px">El tratamiento tributario es referencial. Valídalo con tu contador antes de usarlo para declarar.</div></section></div>`;
}
