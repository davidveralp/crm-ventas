<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E73C32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>DIDIAL CRM</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Red de seguridad: si el navegador no logra cargar el módulo principal
         (típicamente porque una caché vieja apunta a un archivo con hash que ya
         no existe tras un despliegue), en vez de dejar la pantalla en blanco se
         limpia la caché y se recarga una sola vez.
         El centinela en sessionStorage evita un bucle de recargas si el fallo
         es por otra causa. -->
    <script>
      window.addEventListener('error', function (e) {
        var esModulo = e.target && e.target.tagName === 'SCRIPT';
        if (!esModulo) return;
        if (sessionStorage.getItem('recuperando')) return;   // ya se intentó
        sessionStorage.setItem('recuperando', '1');
        if (window.caches && caches.keys) {
          caches.keys().then(function (ns) {
            return Promise.all(ns.map(function (n) { return caches.delete(n); }));
          }).then(function () { location.reload(); });
        } else {
          location.reload();
        }
      }, true);

      // Si la app arrancó bien, se limpia el centinela.
      window.addEventListener('load', function () {
        setTimeout(function () { sessionStorage.removeItem('recuperando'); }, 4000);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
