name: Supabase keep-alive

# Consulta liviana cada 3 días para que el proyecto Supabase (plan Free) no se pause por inactividad.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la API REST de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY"
            exit 1
          fi
          status=$(curl -sS -o body.txt -w "%{http_code}" --max-time 30 --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió HTTP $status"
          head -c 300 body.txt; echo
          if [ "$status" = "401" ] || [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            echo "::error::Supabase no respondió correctamente (HTTP $status)"
            exit 1
          fi
