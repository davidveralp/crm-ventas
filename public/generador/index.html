<body>

<header>
  <img id="logoCabecera" class="marca-logo" alt="Didial">
  <div class="sub">Generador de piezas publicitarias · 1080 × 1350</div>
  <div class="spacer"></div>
  <nav>
    <button class="tab on" data-panel="panelGen">Generador</button>
    <button class="tab" data-panel="panelVeh">Vehículos</button>
    <button class="tab" data-panel="panelCamp">Campañas</button>
    <button class="tab" data-panel="panelRec">Recursos</button>
    <button class="tab" data-panel="panelHist">Historial</button>
    <button class="tab" data-panel="panelDatos">Datos</button>
  </nav>
</header>

<main>
  <div id="izq">
    <div class="panel on" id="panelGen"></div>
    <div class="panel" id="panelVeh"></div>
    <div class="panel" id="panelCamp"></div>
    <div class="panel" id="panelRec"></div>
    <div class="panel" id="panelHist"></div>
    <div class="panel" id="panelDatos"></div>
  </div>

  <div id="der">
    <div class="previsualizacion">
      <div class="barra">
        <span class="dim">PREVISUALIZACIÓN · 1080 × 1350 px · 4:5</span>
        <span class="spacer"></span>
      </div>
      <canvas id="lienzo" width="1080" height="1350"></canvas>
      <div id="validacion"></div>
      <div class="acciones">
        <button id="btnPng">GENERAR PNG</button>
        <button id="btnPdf" class="sec">PDF</button>
        <button id="btnPng3" class="sec">PNG 3× (impresión)</button>
      </div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
